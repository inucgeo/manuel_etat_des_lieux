<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body>
<title>Atlas de l'état des lieux</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Source+Sans+3:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#f3f6f4; --surface:#ffffff; --surface-2:#e9efec; --ink:#13201d; --ink-2:#435551; --ink-3:#5f716c;
  --line:#d3ddd9; --accent:#0d6a5c; --accent-ink:#ffffff; --accent-soft:#d8eee8;
  --warn:#9a5200; --warn-soft:#fbe9d0; --info:#1f5fb8; --info-soft:#dde9f9; --good:#12703a; --bad:#b3261e;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300;
  --grid:#dfe7e4; --shadow:0 1px 2px rgba(19,32,29,.06),0 6px 18px rgba(19,32,29,.06);
  --serif:"Source Serif 4",Georgia,"Times New Roman",serif; --sans:"Source Sans 3",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0e1816; --surface:#14231f; --surface-2:#1b2e29; --ink:#e7f0ec; --ink-2:#adc0b9; --ink-3:#8ba098;
    --line:#2a413b; --accent:#4cc2ab; --accent-ink:#06211c; --accent-soft:#173a33;
    --warn:#e6a04e; --warn-soft:#3a2a12; --info:#84b6f2; --info-soft:#172a44; --good:#5fd08e; --bad:#f08b83;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#2aa02a;
    --grid:#24382f; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  --bg:#0e1816; --surface:#14231f; --surface-2:#1b2e29; --ink:#e7f0ec; --ink-2:#adc0b9; --ink-3:#8ba098;
  --line:#2a413b; --accent:#4cc2ab; --accent-ink:#06211c; --accent-soft:#173a33;
  --warn:#e6a04e; --warn-soft:#3a2a12; --info:#84b6f2; --info-soft:#172a44; --good:#5fd08e; --bad:#f08b83;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#2aa02a;
  --grid:#24382f; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font:16.5px/1.6 var(--sans);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
a{color:var(--accent);text-decoration-thickness:1px;text-underline-offset:2px}
a:hover{text-decoration-thickness:2px}
:focus-visible{outline:2px solid var(--info);outline-offset:2px;border-radius:3px}
h1,h2,h3,h4{font-family:var(--serif);font-weight:600;line-height:1.2;text-wrap:balance;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
table{border-collapse:collapse;width:100%}

/* ---------- top bar ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--line)}
.top .brand{font:600 17px/1 var(--serif);color:var(--ink);text-decoration:none;white-space:nowrap;letter-spacing:.005em}
.top .brand small{display:block;font:500 10.5px/1.2 var(--sans);letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);margin-top:4px}
#menuBtn{display:none;border:1px solid var(--line);background:var(--surface-2);border-radius:6px;padding:7px 11px;font-weight:600;font-size:14px}
.searchbox{position:relative;margin-left:auto;flex:0 1 380px;min-width:0}
.searchbox input{width:100%;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-size:15px}
.results{position:absolute;right:0;left:0;top:calc(100% + 6px);background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);max-height:60vh;overflow:auto;z-index:40}
.results a{display:block;padding:9px 12px;text-decoration:none;color:var(--ink);border-bottom:1px solid var(--line)}
.results a:last-child{border-bottom:0}
.results a:hover,.results a:focus{background:var(--accent-soft)}
.results b{display:block;font-size:14.5px}
.results span{font-size:13px;color:var(--ink-2)}
.results em{font-style:normal;background:var(--warn-soft);padding:0 2px}

/* ---------- layout ---------- */
.layout{display:grid;grid-template-columns:288px minmax(0,1fr);align-items:start}
#rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 57px);height:calc(100vh - 57px);overflow:auto;padding:18px 12px 40px 16px;border-right:1px solid var(--line);background:var(--surface)}
#rail h5{margin:20px 6px 6px;font:600 10.5px/1.3 var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
#rail h5:first-child{margin-top:0}
#rail a{display:flex;align-items:baseline;gap:8px;padding:6px 8px;border-radius:7px;text-decoration:none;color:var(--ink-2);font-size:15px;line-height:1.3}
#rail a:hover{background:var(--surface-2);color:var(--ink)}
#rail a[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
#rail a .n{font:500 11.5px var(--mono);color:var(--ink-3);min-width:20px}
#rail a .pg{margin-left:auto;font:500 11px var(--mono);color:var(--ink-3)}
#rail a .pg.done{color:var(--good)}
#main{padding:28px clamp(16px,4vw,48px) 80px;min-width:0;outline:0}
.wrap{max-width:900px;margin:0 auto}
.pagehead{margin-bottom:22px}
.kicker{font:600 11.5px/1.2 var(--sans);letter-spacing:.11em;text-transform:uppercase;color:var(--accent);margin-bottom:10px}
.pagehead h1{font-size:clamp(28px,4.2vw,42px);letter-spacing:-.01em}
.lead{font:400 19px/1.55 var(--serif);color:var(--ink-2);max-width:66ch;margin:14px 0 0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;padding:3px 10px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--ink-2)}
.chip b{color:var(--ink);font-weight:600}

/* ---------- tabs ---------- */
.tabs{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--line);margin:26px 0 24px;scrollbar-width:thin}
.tabs a{white-space:nowrap;padding:10px 14px;text-decoration:none;color:var(--ink-2);font-weight:500;font-size:15px;border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs a:hover{color:var(--ink)}
.tabs a[aria-current="true"]{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
.tabs a .v{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--line);margin-left:7px;vertical-align:middle}
.tabs a .v.on{background:var(--accent)}

/* ---------- prose ---------- */
.prose{max-width:70ch}
.prose.full{max-width:none}
.prose p{margin:0 0 1em}
.prose h2{font-size:26px;margin:2em 0 .6em}
.prose h3{font-size:20.5px;margin:1.8em 0 .5em}
.prose h4{font:600 16px var(--sans);margin:1.4em 0 .3em;color:var(--ink)}
.prose ul,.prose ol{padding-left:1.25em;margin:0 0 1em}
.prose li{margin:.25em 0}
.prose li::marker{color:var(--accent)}
.prose code,code.k{font:500 .88em var(--mono);background:var(--surface-2);padding:1px 6px;border-radius:4px;overflow-wrap:anywhere}
.prose pre{background:var(--surface-2);padding:12px 14px;border-radius:8px;overflow:auto;font:500 13.5px/1.5 var(--mono)}
.prose blockquote{margin:1em 0;padding:2px 0 2px 16px;border-left:3px solid var(--line);color:var(--ink-2)}
h3.sec{font-size:22px;margin:32px 0 12px}
h3.sec:first-child{margin-top:0}
.muted{color:var(--ink-3)}
.small{font-size:14px}

/* ---------- callouts ---------- */
.co{margin:1.3em 0;padding:14px 16px;border-radius:10px;background:var(--surface);border:1px solid var(--line)}
.co>b:first-child,.co .t{display:block;font:600 12px/1.2 var(--sans);letter-spacing:.09em;text-transform:uppercase;margin-bottom:6px}
.co p:last-child,.co ul:last-child{margin-bottom:0}
.co.def{background:var(--info-soft);border-color:transparent}.co.def>b:first-child,.co.def .t{color:var(--info)}
.co.warn{background:var(--warn-soft);border-color:transparent}.co.warn>b:first-child,.co.warn .t{color:var(--warn)}
.co.tip{background:var(--accent-soft);border-color:transparent}.co.tip>b:first-child,.co.tip .t{color:var(--accent)}

/* ---------- tables ---------- */
.tw{overflow-x:auto;margin:1em 0;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.tw table{font-size:14.5px}
.tw th,.tw td{padding:9px 12px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
.tw tr:last-child td{border-bottom:0}
.tw th{font:600 11.5px/1.3 var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);background:var(--surface-2);white-space:nowrap}
.tw td.num,.tw th.num{text-align:right;font-variant-numeric:tabular-nums}
.tw td:first-child{font-weight:600}
.tw .formula{font:500 13px var(--mono);color:var(--ink)}

/* ---------- source cards ---------- */
.filters{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 16px;align-items:center}
.filters button,.filters select,.filters input{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 14px;font-size:14px}
.filters input{border-radius:8px;min-width:200px}
.filters button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.src-grid{display:grid;gap:14px}
.src{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.src h4{font:600 17px/1.3 var(--sans);display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.src h4 a{color:var(--ink)}
.src .prod{color:var(--ink-2);font-size:14.5px;margin:2px 0 8px}
.src dl{display:grid;grid-template-columns:auto 1fr;gap:3px 14px;margin:8px 0 0;font-size:14.5px}
.src dt{color:var(--ink-3);font-size:12px;letter-spacing:.06em;text-transform:uppercase;padding-top:2px}
.src dd{margin:0}
.badge{font:600 11px/1 var(--sans);letter-spacing:.06em;text-transform:uppercase;padding:4px 8px;border-radius:5px;white-space:nowrap}
.badge.libre{background:var(--accent-soft);color:var(--accent)}
.badge.restreint{background:var(--warn-soft);color:var(--warn)}
.badge.mixte{background:var(--info-soft);color:var(--info)}

/* ---------- accordions ---------- */
details.acc{background:var(--surface);border:1px solid var(--line);border-radius:10px;margin:0 0 10px}
details.acc>summary{cursor:pointer;padding:13px 16px;font-weight:600;list-style:none;display:flex;gap:12px;align-items:baseline}
details.acc>summary::-webkit-details-marker{display:none}
details.acc>summary::before{content:"+";font:500 18px/1 var(--mono);color:var(--accent);width:14px}
details.acc[open]>summary::before{content:"–"}
details.acc>.in{padding:0 18px 16px 42px}
details.acc>.in p:last-child{margin-bottom:0}

/* ---------- recipes ---------- */
.rec{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin:0 0 18px;overflow:hidden}
.rec>header{padding:16px 18px 6px}
.rec .ty{font:600 11px/1 var(--sans);letter-spacing:.09em;text-transform:uppercase;color:var(--accent)}
.rec h4{font:600 18px/1.3 var(--serif);margin:6px 0 4px}
.rec .q{color:var(--ink-2);font-size:15px;margin:0 0 10px}
.tt{display:flex;gap:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--surface-2)}
.tt button{flex:1;border:0;background:transparent;padding:9px 8px;font-weight:600;font-size:14px;color:var(--ink-2);border-bottom:3px solid transparent}
.tt button[aria-selected="true"]{background:var(--surface);color:var(--accent);border-bottom-color:var(--accent)}
.rec .pane{padding:14px 18px 6px}
.rec .pane[hidden]{display:none}
ol.steps{counter-reset:s;list-style:none;padding:0;margin:0 0 12px}
ol.steps li{counter-increment:s;position:relative;padding:0 0 10px 34px;margin:0}
ol.steps li::before{content:counter(s);position:absolute;left:0;top:1px;width:22px;height:22px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font:600 12px/22px var(--sans);text-align:center}
.rec footer{padding:10px 18px 14px;font-size:14.5px;color:var(--ink-2);border-top:1px dashed var(--line)}
.rec footer b{color:var(--warn)}
.na{color:var(--ink-3);font-style:italic}

/* ---------- charts ---------- */
figure.chart{margin:1.4em 0;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px 10px}
figure.chart figcaption.ti{font:600 16px/1.3 var(--sans);margin-bottom:2px}
figure.chart .su{font-size:13.5px;color:var(--ink-3);margin-bottom:10px}
figure.chart svg{display:block;width:100%;height:auto;overflow:visible}
figure.chart .foot{display:flex;flex-wrap:wrap;gap:8px 16px;justify-content:space-between;align-items:baseline;margin-top:8px;font-size:12.5px;color:var(--ink-3)}
figure.chart .foot button{border:1px solid var(--line);background:var(--surface-2);border-radius:6px;padding:3px 10px;font-size:12.5px}
.leg{display:flex;flex-wrap:wrap;gap:6px 16px;margin:0 0 8px;font-size:13.5px;color:var(--ink-2)}
.leg i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.ct{font:500 11.5px var(--sans);fill:var(--ink-2)}
.ct.b{font-weight:600;fill:var(--ink)}
.ct.m{fill:var(--ink-3)}
.gl{stroke:var(--grid);stroke-width:1}
.ax{stroke:var(--ink-3);stroke-width:1}
.mk{transition:opacity .12s}
.mk:hover{opacity:.78}
.tip{position:fixed;z-index:60;pointer-events:none;background:var(--ink);color:var(--bg);font-size:13px;line-height:1.35;padding:6px 10px;border-radius:7px;max-width:260px;box-shadow:var(--shadow)}
.chart-table{margin-top:10px}
.chart-table .tw{margin:0}
.lecture{max-width:70ch;margin:0 0 1.6em;color:var(--ink)}
.lecture .src-line{display:block;margin-top:6px;font-size:13px;color:var(--ink-3)}

/* ---------- widgets ---------- */
.wg{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;margin:1.4em 0;box-shadow:var(--shadow)}
.wg h4{font:600 18px/1.3 var(--serif);margin-bottom:4px}
.wg .d{color:var(--ink-2);font-size:14.5px;margin:0 0 14px}
.wgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.wg label{display:block;font-size:13px;color:var(--ink-2);font-weight:500}
.wg input,.wg select,.wg textarea{display:block;width:100%;margin-top:4px;padding:8px 10px;border:1px solid var(--line);border-radius:7px;background:var(--bg)}
.wg textarea{min-height:88px;font:500 13px/1.5 var(--mono);resize:vertical}
.wout{margin-top:14px;padding:14px 16px;border-radius:9px;background:var(--accent-soft);color:var(--ink)}
.wout .big{font:600 30px/1.1 var(--serif);color:var(--accent);font-variant-numeric:tabular-nums}
.wout .row{display:flex;flex-wrap:wrap;gap:6px 22px;align-items:baseline}
.wout p{margin:6px 0 0;font-size:14.5px}
.swatches{display:flex;gap:0;margin:8px 0}
.swatches span{flex:1;height:16px}
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:8px;padding:8px 16px;font-weight:600}
.btn.ghost{background:transparent;color:var(--accent)}
.btn:disabled{opacity:.5;cursor:default}

/* ---------- quiz ---------- */
.quiz{display:grid;gap:14px}
.qq{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.qq p.qt{font-weight:600;margin:0 0 10px}
.qq label{display:flex;gap:10px;align-items:flex-start;padding:7px 10px;border-radius:8px;cursor:pointer;margin:0 -10px}
.qq label:hover{background:var(--surface-2)}
.qq input{margin-top:5px;accent-color:var(--accent)}
.qq.ok{border-color:var(--good)}
.qq.ko{border-color:var(--bad)}
.qq .ex{display:none;margin-top:10px;padding:10px 12px;background:var(--surface-2);border-radius:8px;font-size:15px}
.qq.done .ex{display:block}
.qq.done label.right{color:var(--good);font-weight:600}
.qq.done label.wrong{color:var(--bad)}
.scorebar{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-top:6px}
.checks{list-style:none;padding:0;margin:0;display:grid;gap:4px}
.checks label{display:flex;gap:10px;align-items:flex-start;padding:8px 12px;border:1px solid var(--line);border-radius:9px;background:var(--surface);cursor:pointer}
.checks input{margin-top:5px;accent-color:var(--accent)}
.checks input:checked+span{color:var(--ink-3);text-decoration:line-through;text-decoration-color:var(--line)}

/* ---------- home ---------- */
.hero{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:32px;align-items:center;margin-bottom:34px}
.hero h1{font-size:clamp(32px,5vw,52px);letter-spacing:-.015em}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.card{display:block;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;text-decoration:none;color:var(--ink);transition:border-color .12s,transform .12s}
.card:hover{border-color:var(--accent);transform:translateY(-1px)}
.card .n{font:500 11.5px var(--mono);color:var(--accent)}
.card b{display:block;font:600 17px/1.25 var(--serif);margin:4px 0}
.card span{font-size:14px;color:var(--ink-2)}
.path{display:grid;gap:10px}
.path .st{display:grid;grid-template-columns:34px 1fr;gap:12px}
.path .st i{font:600 13px/28px var(--sans);font-style:normal;text-align:center;width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--accent-ink)}
.sysmap{width:100%;height:auto;display:block}
.sysmap .nd{cursor:pointer}
.sysmap .nd circle{fill:var(--surface);stroke-width:2}
.sysmap .nd text{font:600 11px var(--sans);fill:var(--ink);pointer-events:none}
.sysmap .nd.dim{opacity:.35}
.sysmap .ed{fill:none;stroke:var(--ink-3);stroke-width:1.2;opacity:.35}
.sysmap .ed.on{stroke:var(--accent);stroke-width:2.4;opacity:1}
.syspanel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;min-height:120px}
.syspanel ul{padding-left:1.1em;margin:6px 0}
.sysgrid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:18px;align-items:start}
.pn{display:flex;justify-content:space-between;gap:12px;margin-top:40px;padding-top:18px;border-top:1px solid var(--line);flex-wrap:wrap}
.pn a{text-decoration:none;font-weight:600;padding:9px 14px;border:1px solid var(--line);border-radius:9px;background:var(--surface)}
.pn a:hover{border-color:var(--accent)}
.legend-dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}

@media (max-width:980px){
  .layout{grid-template-columns:minmax(0,1fr)}
  #menuBtn{display:inline-block}
  #rail{position:fixed;z-index:35;top:calc(env(safe-area-inset-top,0px) + 57px);left:0;bottom:0;width:min(320px,88vw);height:auto;transform:translateX(-102%);transition:transform .18s;box-shadow:var(--shadow)}
  body.menu #rail{transform:none}
  .hero,.sysgrid{grid-template-columns:minmax(0,1fr)}
  .top .brand small{display:none}
}
@media (max-width:560px){
  .searchbox{flex:1 1 auto}
  .top .brand{display:none}
  .lead{font-size:17.5px}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}}
</style>

<div id="app">
  <header class="top">
    <button id="menuBtn" type="button" aria-label="Ouvrir le sommaire">Sommaire</button>
    <a class="brand" href="#/accueil">Atlas de l'état des lieux<small>Manuel de diagnostic territorial</small></a>
    <div class="searchbox">
      <input id="q" type="search" placeholder="Rechercher : vacance, DVF, Magrit, RGA…" autocomplete="off" aria-label="Rechercher dans le manuel">
      <div id="results" class="results" hidden></div>
    </div>
  </header>
  <div class="layout">
    <nav id="rail" aria-label="Sommaire"></nav>
    <main id="main" tabindex="-1"></main>
  </div>
</div>
<div id="tip" class="tip" hidden></div>

<script>
/* Atlas de l'état des lieux — moteur (registre, rendu, graphiques, quiz) */
(function () {
  'use strict';
  var M = window.M = { parts: [], pages: [], byId: {}, sources: [], gloss: [], W: {}, specs: [], quizzes: {} };

  /* ---------- utilitaires ---------- */

  M.W.discret = function (el) {

  var CHOIX = [

    html: `
<div class="prose">
<h2>1. État des lieux, diagnostic, enjeux : trois niveaux de discours</h2>
<p>Le vocabulaire des études territoriales est flottant. Dans ce manuel, trois niveaux sont distingués, parce qu’ils appellent des preuves différentes.</p>
<ul>
<li>L’<b>état des lieux</b> décrit une situation à partir d’observations sourcées : combien, où, depuis quand, en comparaison de quoi. Il est vérifiable et, en principe, reproductible par un autre analyste disposant des mêmes données.</li>
<li>Le <b>diagnostic</b> interprète l’état des lieux : il propose des mécanismes explicatifs (pourquoi les prix fonciers augmentent-ils à l’ouest ?), hiérarchise et met en relation les constats. Il comporte une part de jugement qu’il faut expliciter.</li>
<li>Les <b>enjeux</b> formulent ce qui est en jeu pour le territoire au regard d’objectifs d’action (ce qu’il y a à gagner ou à perdre). Ils relèvent d’un choix collectif et ne se déduisent pas mécaniquement des chiffres.</li>
</ul>
<p>Ce manuel outille surtout le premier niveau et prépare le deuxième par la lecture croisée des thèmes. La rédaction des enjeux est abordée au chapitre <a href="#/synthese">Du constat aux enjeux</a>.</p>
${M.co('def', 'Données froides', '<p>On appelle ici « données froides » les statistiques et données géographiques produites en dehors du territoire, de façon systématique et comparable : recensement, fichiers fiscaux, registres administratifs, bases cartographiques. Elles s’opposent aux « données chaudes » recueillies par l’équipe (entretiens, observations de terrain, questionnaires). Les données froides fournissent l’ossature quantitative ; elles ne disent rien des perceptions, des pratiques ni des stratégies d’acteurs, et une étude sérieuse les complète par un travail de terrain.</p>')}

<h2>2. Pourquoi une lecture systémique</h2>
<p>Un territoire n’est pas une juxtaposition de thèmes. Les évolutions démographiques, l’offre de logements, les prix, les emplois, les déplacements, la consommation d’espace et l’état des milieux se déterminent réciproquement. Une approche systémique cherche à repérer ces relations plutôt qu’à décrire chaque secteur pour lui-même. Quatre notions suffisent pour commencer :</p>
<ul>
<li><b>Éléments</b> : les thèmes ou variables observés (ménages, logements, emplois, sols, masses d’eau, aléas).</li>
<li><b>Relations</b> : les influences entre éléments (le desserrement des ménages accroît la demande de logements ; l’imperméabilisation aggrave le ruissellement).</li>
<li><b>Boucles</b> : des chaînes de relations qui se referment. Elles expliquent les dynamiques cumulatives (un parc social sous-dimensionné et des loyers privés élevés entretiennent une demande HLM croissante) ou stabilisatrices.</li>
<li><b>Frontières et échelles</b> : le périmètre d’étude est un choix ; des phénomènes essentiels se jouent au-delà (les flux domicile-travail vers Toulouse ou Albi pour la communauté d’agglomération Gaillac-Graulhet).</li>
</ul>
<p>Concrètement, la lecture systémique se pratique à chaque thème en posant les mêmes questions : <i>de quoi dépend cette variable ? sur quoi agit-elle ? avec quel décalage dans le temps ? à quelle échelle ?</i> Les onglets « Enjeux et indicateurs » de chaque thème listent ses relations principales, et la <a href="#/systeme">carte des interactions</a> les rassemble.</p>
</div>
<div class="prose full">${M.widget('sysmap')}</div>
<div class="prose">
<h2>3. Cinq questions pour lire un indicateur</h2>
<p>Un indicateur isolé ne signifie rien. La grille suivante, appliquée systématiquement, garantit une lecture minimale.</p>
${M.table(['Question', 'Ce qu’il faut produire', 'Exemple (taille moyenne des ménages)'], [
      ['1. Quel niveau ?', 'La valeur actuelle, avec son unité et son millésime.', '2,23 personnes par ménage en 2022.'],
      ['2. Quelle trajectoire ?', 'L’évolution sur au moins deux dates, exprimée en valeur absolue et en taux annuel moyen.', '2,32 en 2011, soit −0,37 % par an.'],
      ['3. Quelle comparaison ?', 'Un ou deux territoires de référence (département, région, territoires voisins ou comparables).', 'Tarn : 2,09 ; la communauté d’agglomération reste au-dessus.'],
      ['4. Quelles disparités internes ?', 'Une lecture infra-territoriale : communes, IRIS, carreaux, ou catégories de population.', 'Gaillac 2,06 ; périurbain 2,34.'],

    ])}
<h2>4. Choisir le périmètre et les points de comparaison</h2>
<p>Le territoire d’étude est souvent imposé (intercommunalité, périmètre de SCoT). Deux précautions s’imposent. D’abord, décrire l’<b>environnement</b> immédiat : les voisins directs, les pôles qui polarisent les flux, le département et la région. Ensuite, choisir des <b>territoires de comparaison</b> justifiés : la moyenne départementale n’est pertinente que si le territoire lui ressemble ; une typologie (densité, aire d’attraction, ruralité) permet de construire des comparables. Un indicateur « supérieur à la moyenne » n’a de sens qu’avec une référence explicite.</p>
<h2>5. Sept étapes d’un état des lieux</h2>
<ol>
<li><b>Cadrer.</b> Périmètre, thèmes, échelle fine, période, commande, destinataires, livrables.</li>
<li><b>Inventorier les sources.</b> Pour chaque thème, dresser la fiche de source (producteur, millésime, champ, licence, accès).</li>
<li><b>Collecter et contrôler.</b> Télécharger, archiver le fichier brut, vérifier les codes géographiques et les effectifs.</li>
<li><b>Traiter.</b> Calculer les indicateurs, contrôler les ordres de grandeur, documenter les formules.</li>
<li><b>Restituer.</b> Choisir le graphique, le tableau ou la carte adaptés (voir <a href="#/restitution">Bien restituer</a>).</li>
<li><b>Croiser.</b> Mettre en relation les thèmes, confronter aux acteurs et au terrain.</li>
<li><b>Conclure.</b> Synthèse hiérarchisée et enjeux formulés.</li>
</ol>
<h2>6. Anatomie d’un chapitre d’état des lieux</h2>
<p>Les porters à connaissance de l’État illustrent une composition efficace, transposable à un rapport d’atelier : un titre-message qui énonce le constat, un texte court, un graphique ou une carte, des encadrés de définition (« A-Z ») pour les notions techniques, et un encadré final « enjeux ». Le texte se construit avec une phrase-type en quatre temps : <i>constat chiffré, comparaison, explication, réserve</i>. Exemple : « La taille moyenne des ménages passe de 2,32 à 2,23 personnes entre 2011 et 2022 (constat), soit une baisse plus lente que dans le Tarn (comparaison), en lien avec la progression des personnes seules (explication) ; l’indicateur ne rend pas compte des ménages en collectivité (réserve). »</p>
</div>
${M.co('tip', 'Points de contrôle', '<p>Avant de passer au thème suivant : chaque chiffre a-t-il une unité, une date et une source ? Chaque comparaison a-t-elle une référence ? Chaque interprétation est-elle signalée comme telle ?</p>')}
`

<h2>2. Trois dates à ne pas confondre</h2>
<p>Chaque donnée porte au moins trois dates : la <b>date de référence</b> (à quelle situation elle se rapporte), la <b>période de collecte</b> (quand l’information a été recueillie) et la <b>date de publication</b> (quand elle est accessible). Le recensement en est le meilleur exemple : il repose sur une collecte annuelle glissante sur cinq ans, un millésime est centré sur l’année médiane du cycle, et les résultats détaillés sont mis en ligne environ trois ans après.</p>
${M.co('def', 'Populations légales et millésimes de l’Insee', '<p>Les populations de référence de millésime 2023 sont authentifiées par décret du 26 décembre 2025 et entrent en vigueur le 1<sup>er</sup> janvier 2026. La <b>population municipale</b> compte les personnes ayant leur résidence habituelle dans la commune ; la <b>population comptée à part</b> regroupe, par exemple, des étudiants logés hors de la commune familiale ; la <b>population totale</b> est la somme des deux. Pour comparer deux dates, il est prudent d’éviter les millésimes trop proches (les échantillons de cinq ans se chevauchent) ; pour le millésime 2023, l’Insee invite à comparer avec des millésimes espacés d’au moins six ans, en raison des perturbations liées à la crise sanitaire (vérifier la note méthodologique en vigueur).</p>')}
<p>Conséquence pratique : indiquer systématiquement, dans les titres de figures, l’année de référence de la donnée et non l’année de rédaction ; et éviter de comparer deux années trop proches du recensement, qui partagent une partie des mêmes enquêtes.</p>

<h2>3. Échelles et découpages</h2>
<p>Le même indicateur change de visage selon la maille. Il faut choisir la maille la plus fine que la donnée autorise sans instabilité statistique, puis agréger pour la lecture d’ensemble.</p>
${M.table(['Maille', 'Définition succincte', 'Usage et précautions'], [

<h2>4. Le code officiel géographique</h2>
<p>Chaque année, des communes fusionnent, se scindent ou changent de rattachement. Les jeux de données sont publiés « au 1<sup>er</sup> janvier de l’année N » ; deux fichiers de millésimes différents peuvent donc contenir des communes différentes. Règle de travail : choisir <b>un</b> millésime géographique pour toute l’étude, télécharger le fond communal correspondant, et utiliser les tables de passage de l’Insee pour ramener les autres fichiers à cette géographie. Une jointure qui laisse des lignes sans correspondance signale presque toujours ce problème ; ne jamais la corriger « à la main » sans comprendre.</p>
<h2>5. Secret statistique, petits effectifs et valeurs manquantes</h2>
<p>Pour protéger la vie privée ou parce que les effectifs sont trop faibles, les producteurs masquent, arrondissent ou regroupent des valeurs. Le cas des revenus localisés est typique : les indicateurs ne sont diffusés que si l’effectif dépasse un seuil. Sur une carte, une valeur masquée ne doit <b>jamais</b> être remplacée par zéro : elle est représentée par une couleur ou une trame « non disponible » explicitement légendée. Sur de petits effectifs, les pourcentages sont instables : privilégier des périodes plus longues, des regroupements ou des effectifs bruts.</p>
<h2>6. Effectifs, ratios, indices : ne pas mélanger les unités</h2>
<ul>
<li>Un <b>stock</b> est un effectif à une date (nombre de logements vacants) ; un <b>flux</b> est une quantité sur une période (logements autorisés en 2025).</li>
<li>Un <b>ratio</b> rapporte deux grandeurs (taux de vacance) ; le dénominateur doit être précisé et cohérent avec le numérateur.</li>
<li>Un <b>indice</b> compare à une référence (base 100). L’évolution d’un pourcentage se mesure en <b>points</b>, non en pourcentage : de 4 % à 5 %, la hausse est de un point, soit +25 %.</li>
<li>Le <b>taux annuel moyen</b> rend comparables des périodes de durées différentes (voir l’<a href="#/ateliers">atelier de calcul</a>).</li>
</ul>

${R({ type: 'Calcul', t: 'R3. Calculs de base : part, évolution, taux annuel moyen, indice base 100', quand: 'Construire les indicateurs des onglets « Enjeux et indicateurs ».', outils: { tableur: ['Part : <code>=B2/B$10*100</code> avec le total en ligne 10 ; verrouiller le dénominateur par <code>$</code>.', 'Évolution en valeur relative : <code>=(C2-B2)/B2</code> ; en points de pourcentage : <code>=C2-B2</code> pour deux taux.', 'Taux annuel moyen sur n années : <code>=(C2/B2)^(1/n)-1</code>, avec n en cellule séparée (exemple : <code>=(C2/B2)^(1/$G$1)-1</code>).', 'Indice base 100 : <code>=C2/$B2*100</code> ; pour des séries, l’année de base se met sur la première colonne.', 'Vérifier les ordres de grandeur par un calcul mental (la somme des parts fait-elle 100 ?) et figer les résultats en valeurs avant export.'], magrit: ['Magrit dispose d’une calculatrice de champs (nouveau champ à partir d’une formule) : utile pour un ratio simple sans repasser par le tableur.'], qgis: ['<i>Calculatrice de champ</i> (icône abaque) : créer un champ décimal avec une expression telle que <code>"logements_vacants" / "parc_total" * 100</code>.', 'Protéger la division : <code>CASE WHEN "parc_total" &gt; 0 THEN "vacants"/"parc_total"*100 END</code>.'] } })}
${R({ type: 'Carte', t: 'R4. Carte choroplèthe (ratio par commune)', quand: 'Montrer la variation spatiale d’un taux, d’un indice, d’un prix médian ou d’un revenu médian.', outils: { magrit: ['Importer le fond communal et le tableau ; réaliser la jointure (R2).', 'Choisir le menu de représentation « Choroplèthe » ; sélectionner la variable (un <b>ratio</b> uniquement).', 'Examiner l’histogramme de la variable, puis choisir la discrétisation (quantiles, seuils naturels, intervalles égaux) et 4 à 6 classes ; comparer avec le <a href="#/ateliers">simulateur</a>.', 'Choisir une palette séquentielle (une teinte du clair au foncé) ou divergente autour d’une valeur pivot (0, moyenne départementale).', 'Renseigner un titre explicite (quoi, où, quand), la source et l’échelle ; exporter en SVG pour finition, ou en PNG.'], qgis: ['Propriétés de la couche &gt; <i>Symbologie</i> &gt; <b>Gradué</b> ; choisir le champ, le mode (quantile, Jenks, intervalles égaux) et le nombre de classes.', 'Choisir une rampe de couleurs (rampes ColorBrewer disponibles) ; ajuster les bornes arrondies ; formater la légende avec une précision adaptée.', 'Créer une <i>mise en page</i> (Projet &gt; Nouvelle mise en page) : carte, légende, titre, échelle, source, export PDF ou image.'], tableur: ['Le tableur ne réalise pas de carte ; il sert à préparer la variable et à contrôler les valeurs extrêmes avant la carte.'] }, piege: 'Ne jamais cartographier un effectif brut en choroplèthe : les grandes communes dominent visuellement. Utiliser des symboles proportionnels (R5) ou un ratio.' })}
${R({ type: 'Carte', t: 'R5. Symboles proportionnels (stocks)', quand: 'Représenter des effectifs (logements autorisés, demandeurs HLM, emplois).', outils: { magrit: ['Sur la couche communale jointe, choisir « Symboles proportionnels » ; sélectionner la variable d’effectifs.', 'Choisir la forme (cercle), la taille maximale et la valeur associée ; vérifier la légende (cercles de référence).', 'Optionnel : colorer les symboles par un second champ (une catégorie), ou superposer au fond choroplèthe (ratio) pour une carte à deux variables.'], qgis: ['<i>Symbologie</i> de la couche de centroïdes &gt; taille par attribut : <i>Définition définie par les données &gt; Assistant</i>, méthode « aire » (surface proportionnelle) et non « rayon ».', 'Trier les objets par taille décroissante pour éviter que les gros cercles masquent les petits (<i>Rendu &gt; Ordre de rendu des objets</i>).', 'Générer les centroïdes avec <i>Vecteur &gt; Outils de géométrie &gt; Centroïdes</i> ou <code>centroid($geometry)</code>.'], tableur: ['Préparer le tableau (code commune, effectif) et contrôler les totaux.'] }, piege: 'La taille d’un symbole doit être proportionnelle à la <b>surface</b> du cercle. Un rayon proportionnel à la valeur exagère les écarts.' })}
${R({ type: 'Carte', t: 'R6. Carte de flux (migrations, domicile-travail)', quand: 'Montrer des échanges entre lieux à partir d’une matrice origine-destination.', outils: { magrit: ['Préparer un tableau avec trois colonnes : code d’origine, code de destination, valeur du flux (fichier de flux de l’Insee, filtré sur le territoire).', 'Importer le fond et le tableau ; choisir la représentation par liens et sélectionner les champs origine/destination et la valeur.', 'Appliquer un seuil de représentation (par exemple, flux supérieurs à 100) et une largeur proportionnelle ; distinguer entrants et sortants par la couleur.'], qgis: ['Construire dans le tableur une colonne de géométrie texte : <code>="LINESTRING("&amp;X1&amp;" "&amp;Y1&amp;","&amp;X2&amp;" "&amp;Y2&amp;")"</code> avec les coordonnées des centroïdes.', 'Importer le CSV avec <i>Ajouter une couche de texte délimité</i> en choisissant « Géométrie WKT ».', 'Épaisseur des lignes proportionnelle à la valeur (assistant de taille), avec flèche éventuelle (marqueur de fin de ligne).'], tableur: ['Filtrer les flux internes (origine = destination) et regrouper par intercommunalité pour lisibilité ; calculer entrants, sortants et solde.'] }, piege: 'Une carte de tous les flux est illisible : filtrer par seuil et par territoire d’intérêt, et donner en légende le seuil retenu.' })}
${R({ type: 'Carte', t: 'R7. Lissage et carroyage', quand: 'Lever l’effet des limites communales : densité de population, prix, équipements, transactions.', outils: { magrit: ['Choisir « Carte lissée » (potentiel de Stewart) ou « Carroyage » sur une couche de points ou de polygones ; choisir un stock (population, emplois).', 'Fixer le rayon d’influence (portée) et la résolution de la grille selon l’échelle d’analyse.', 'Examiner les isolignes ou les classes obtenues ; nommer la portée en légende.'], qgis: ['<i>Vecteur &gt; Outils de recherche &gt; Créer une grille</i> (carrés de 500 m par exemple, en Lambert-93) sur l’emprise du territoire.', '<i>Vecteur &gt; Outils d’analyse &gt; Compter les points dans les polygones</i> (ou <i>Joindre les attributs par localisation (résumé)</i> pour médiane, moyenne).', 'Supprimer les mailles vides ou sous un seuil d’effectif pour respecter le secret statistique.', 'Alternative : <i>Symbologie &gt; Carte de chaleur</i> pour une lecture rapide de densité de points.'], tableur: ['Non adapté : le traitement requiert la géométrie.'] }, piege: 'Le résultat dépend de la portée et de la taille de maille ; les indiquer en légende. Les mailles à faible effectif produisent des médianes instables.' })}
${R({ type: 'Analyse spatiale', t: 'R8. Analyses spatiales de base dans QGIS', quand: 'Croiser deux couches : périmètres, sols, risques, équipements.', outils: { qgis: ['<b>Découper</b> une couche nationale ou départementale à l’emprise du territoire : <i>Vecteur &gt; Géotraitement &gt; Découper</i>.', '<b>Intersection</b> (par exemple, occupation du sol × zone inondable) : <i>Vecteur &gt; Géotraitement &gt; Intersection</i>, puis calculer la surface avec <code>$area</code> (ellipsoïdale) ou <code>area($geometry)</code> (planimétrique) dans un champ décimal.', '<b>Statistiques zonales / résumé par localisation</b> : compter des points par polygone ou sommer des surfaces ; utiliser <i>Joindre les attributs par localisation (résumé)</i>.', '<b>Tampon</b> autour d’équipements (500 m) : <i>Vecteur &gt; Géotraitement &gt; Tampon</i> ; croiser avec la population pour mesurer une couverture (attention aux doubles comptes).', '<b>Accessibilité</b> : isolignes de temps de trajet via l’extension « ORS Tools » (service OpenRouteService, clé gratuite) ou analyse de réseau (extension « QNEAT3 ») ; préciser le mode (voiture, marche, vélo).', 'Vérifier la géométrie avant tout traitement : <i>Vecteur &gt; Outils de géométrie &gt; Vérifier la validité</i>.'], magrit: ['Non adapté : Magrit ne réalise pas de géotraitement croisé.'], tableur: ['Non adapté : ces traitements requièrent la géométrie ; le tableur reçoit les résultats (surfaces, effectifs) après export du tableau attributaire.'] }, piege: 'Travailler en projection Lambert-93 (EPSG:2154) pour les surfaces et les distances ; une couche en WGS 84 fausse les mesures. Enregistrer les résultats dans un GeoPackage documenté.' })}

    resume: 'Choisir la forme qui convient à la donnée, respecter quelques règles de sémiologie, éviter les douze erreurs les plus courantes et rédiger la lecture.',
    html: `
<div class="prose">
<h2>1. Le message d’abord</h2>
<p>Une restitution répond à une question et porte un message ; le titre l’énonce. « Le desserrement des ménages se poursuit dans toute l’agglomération » vaut mieux que « Taille des ménages ». Avant de produire une figure, formuler en une phrase ce qu’elle doit faire comprendre ; si la phrase est impossible à écrire, la figure est prématurée.</p>
</div>
<div class="prose full">${M.widget('choix')}</div>
<div class="prose">
<h2>2. Notions de sémiologie graphique</h2>
<p>Les variables visuelles n’expriment pas toutes les mêmes relations. Jacques Bertin en a fixé les principes que l’on applique encore.</p>
${M.table(['Variable visuelle', 'Exprime', 'Emploi cartographique'], [
      ['Taille', 'Une quantité (rapport de proportion)', 'Symboles proportionnels pour les effectifs ; largeur des flux.'],
      ['Valeur (clair à foncé)', 'Un ordre', 'Choroplèthe d’un taux, d’un indice, d’un prix : une seule teinte du clair au foncé.'],
      ['Couleur (teinte)', 'Une différence de nature', 'Catégories (types d’occupation du sol, statuts) ; jamais pour une progression.'],
      ['Grain, texture', 'Un ordre ou une différence', 'Complément à la couleur ; utile en impression noir et blanc.'],
      ['Forme, orientation', 'Une différence de nature', 'Pictogrammes (types d’équipements).']
    ])}
<h2>3. Règles pour les cartes choroplèthes</h2>
<ul>
<li><b>Ratio uniquement</b> : taux, part, indice, prix médian, densité. Jamais d’effectifs bruts.</li>
<li><b>Discrétisation explicite</b> : exposer la méthode et les bornes ; comparer plusieurs méthodes ; 4 à 6 classes ; des bornes arrondies lisibles. Des seuils identiques sont nécessaires pour comparer deux cartes (deux dates, deux territoires).</li>
<li><b>Palette adaptée</b> : séquentielle (une teinte) pour une progression ; divergente (deux teintes et un centre neutre) autour d’une valeur charnière (0 pour un solde, moyenne départementale pour un écart) ; qualitative pour des catégories, 6 au plus.</li>
<li><b>Valeurs absentes</b> : couleur ou trame distincte, légendée « secret statistique » ou « non disponible ».</li>
<li><b>Fond de carte sobre</b> : limites communales fines, relief ou fond neutre ; pas d’ornements.</li>
</ul>
${M.co('def', 'Éléments obligatoires d’une carte', '<p>Titre (quoi, où, quand) ; légende complète avec unité ; échelle graphique ; orientation si la carte n’est pas au nord ; source et date de la donnée ; auteur et date de réalisation ; périmètre d’étude bien visible. Une carte sans source n’est pas citable.</p>')}
<h2>4. Règles pour les graphiques</h2>
<ul>
<li>Un graphique porte une seule idée. Éviter les doubles axes verticaux : représenter deux grandeurs de nature différente sur deux graphiques alignés ou en indice base 100.</li>
<li>Les barres partent de zéro ; la longueur exprime la valeur. Trier les catégories par valeur lorsque l’ordre n’est pas naturel.</li>
<li>Limiter les couleurs ; les grouper par sens ; ne pas faire varier la couleur sans information ; vérifier la lisibilité en niveaux de gris.</li>
<li>Pas plus de cinq séries sur un même graphique ; un graphique en secteurs se limite à trois parts.</li>
<li>Étiqueter directement les séries ou les repères importants ; donner l’unité et la source.</li>
</ul>
<h2>5. Règles pour les tableaux</h2>
<ul>
<li>Un tableau donne les valeurs précises que le graphique ne permet pas de lire ; il compare, il ne raconte pas.</li>
<li>Aligner les nombres à droite, harmoniser les décimales, séparer les milliers, indiquer les unités dans l’en-tête.</li>
<li>Mettre en évidence la ligne du territoire d’étude et la ligne de référence (département).</li>
<li>Arrondir de façon cohérente : deux chiffres significatifs suffisent pour un pourcentage, sauf besoin précis.</li>
</ul>
<h2>6. Douze erreurs fréquentes</h2>
<ol>
<li>Cartographier des effectifs bruts en choroplèthe.</li>
<li>Comparer deux cartes discrétisées avec des seuils différents.</li>
<li>Remplacer une valeur masquée par zéro.</li>
<li>Ignorer les ruptures de série (changement de zonage, de définition).</li>
<li>Comparer deux millésimes du recensement trop proches ou de géographies différentes.</li>
<li>Interpréter une corrélation spatiale comme une causalité.</li>
<li>Omettre la référence (département, région) et se contenter d’adjectifs (« élevé »).</li>
<li>Confondre points de pourcentage et pourcentage.</li>
<li>Utiliser une échelle de couleurs arc-en-ciel pour une variable ordonnée.</li>
<li>Tronquer l’axe d’un histogramme pour amplifier un écart.</li>
<li>Superposer trop d’informations (couches, étiquettes) sur une même carte.</li>
<li>Oublier de citer la source, la date et le territoire.</li>
</ol>
<h2>7. Rédiger la lecture d’une figure</h2>
<p>Une figure ne se suffit pas ; elle est accompagnée d’un texte de deux à quatre phrases : <b>constat</b> (le chiffre clé), <b>comparaison</b> (avec la référence ou une autre date), <b>explication</b> (mécanisme plausible), <b>réserve</b> (limite de la donnée ou incertitude). Employer des verbes précis (« passe de… à… », « dépasse… de… points ») et éviter les adjectifs non mesurés (« important », « fort »).</p>
<h2>8. Accessibilité</h2>
<p>Environ une personne sur douze parmi les hommes présente une déficience de perception des couleurs. Utiliser des palettes lisibles pour tous (rampes à variation de valeur nette), doubler la couleur d’un autre codage (forme, étiquette, texture) et vérifier les contrastes du texte. Prévoir la version imprimée en noir et blanc : les tons doivent rester ordonnés.</p>
</div>
`
  });

    limites: [
      { t: 'Territoire de projet et territoires vécus', h: '<p>Un périmètre intercommunal est un découpage politique. Les zonages de l’Insee (aires d’attraction, bassins de vie) mesurent des pratiques (déplacements, accès aux services). Il faut décrire les deux : le PAC du PLH de la CA Gaillac-Graulhet relève par exemple que le territoire est fragmenté entre quatre aires d’attraction et neuf bassins de vie.</p>' },
      { t: 'Ruptures de zonage', h: '<p>Le zonage en aires d’attraction des villes (2020) a succédé aux aires urbaines de 2010 ; les seuils et la méthode diffèrent (le zonage de 2020 retient un pôle et une couronne dont au moins 15 % des actifs travaillent dans le pôle). Un état des lieux ancien, comme l’état des lieux du SCoT du Castrais de 2019, s’appuie sur l’ancien zonage : les deux ne se comparent pas.</p>' },
      { t: 'Fusions de communes et code officiel géographique', h: '<p>Le nombre de communes change chaque année. Avant toute jointure, vérifier que le fond de carte et les données partagent la même géographie. Sinon : lignes non appariées, communes manquantes ou doublées.</p>' },

    exemple: {

  /* =============== 2. DÉMOGRAPHIE =============== */
  M.chapter({
    id: 'demographie', num: 2, part: 'B', short: 'Démographie et ménages', title: 'Population, ménages et mobilités résidentielles',
    card: 'Évolution, soldes, âges, ménages, migrations : d’où viennent et où vont les habitants.',
    kicker: 'Société', duree: '45 min', niveau: 'Débutant', outils: 'Tableur · Magrit · QGIS',
    resume: 'Mesurer combien d’habitants compte le territoire, d’où vient sa croissance, comment la population vieillit et se recompose en ménages, et qui vient s’y installer ou le quitte.',
    enjeux: {
      intro: '<p>La démographie est la variable d’entrée de la plupart des autres thèmes : le nombre et la composition des ménages déterminent les besoins de logements, de services et de mobilité. Elle se lit sous quatre angles complémentaires : le niveau et l’évolution de la population, les ressorts de cette évolution (naissances, décès, migrations), la structure par âge, et la structure des ménages.</p>',
      questions: [
        'Combien d’habitants, et selon quel rythme la population évolue-t-elle depuis 30 ou 50 ans ?',
        'La croissance ou la décroissance vient-elle du solde naturel ou du solde migratoire ?',
        'Comment évolue la structure par âge (vieillissement, arrivée de familles, départ des jeunes adultes) ?',
        'Comment se recomposent les ménages (taille, personnes seules, familles monoparentales) ?',
        'Qui arrive, qui part, d’où et vers où (flux résidentiels par âge et catégorie sociale) ?'
      ],
      indicateurs: [
        { n: 'Population municipale', f: 'valeur publiée (populations légales ou de référence)', l: 'Préférer la population municipale pour les évolutions ; la population totale sert aux seuils réglementaires.' },
        { n: 'Taux d’évolution annuel moyen', f: '(P₁ ÷ P₀)^(1/n) − 1', l: 'Comparer des périodes de durées différentes. Voir l’atelier de calcul.' },
        { n: 'Taux dû au solde naturel', f: '(naissances − décès) ÷ n ÷ population moyenne', l: 'Issu des statistiques d’état civil ; à rapprocher du recensement avec prudence.' },
        { n: 'Solde migratoire apparent', f: 'évolution totale − solde naturel', l: 'Calculé par différence : agrège arrivées, départs et erreurs.' },
        { n: 'Indice de vieillissement', f: 'population de 65 ans et plus ÷ population de moins de 20 ans × 100', l: 'Supérieur à 100 : plus de seniors que de jeunes. Sensible au seuil d’âge retenu.' },
        { n: 'Taille moyenne des ménages', f: 'population des ménages ÷ nombre de ménages', l: 'Mesure le desserrement ; ne pas confondre avec la population totale.' },
        { n: 'Part des personnes seules, des familles monoparentales', f: 'effectif de la catégorie ÷ nombre de ménages × 100', l: 'Indicateurs de fragilité et de besoin de petits logements.' },
        { n: 'Taux de mobilité résidentielle', f: 'habitants ayant changé de logement dans l’année ÷ population × 100', l: 'Distinguer mobilité interne à la commune et arrivées de l’extérieur.' }
      ],
      liens: [['parc', 'le desserrement des ménages accroît les besoins en logements à population constante.'], ['equipements', 'la structure par âge oriente les besoins en petite enfance, éducation, santé et hébergement des aînés.'], ['marches', 'les flux résidentiels suivent les écarts de prix (report immobilier).'], ['revenus', 'niveaux de revenus et profil des arrivants sont liés.'], ['mobilites', 'l’accessibilité aux pôles d’emploi façonne la périurbanisation.']]
    },
    sources: [
      s('Populations légales et populations de référence', 'Insee', 'https://www.insee.fr/fr/statistiques/8681011', 'libre', 'Communes, EPCI, départements', 'Annuelle (décret de fin d’année)', 'CSV, Excel, PDF', 'Insee, Recensement de la population, Populations de référence', 'Les populations de référence de millésime 2023 sont en vigueur depuis le 1er janvier 2026.'),
      s('Recensement : séries historiques et chiffres détaillés', 'Insee', 'https://www.insee.fr/fr/information/2008354', 'libre', 'Communes, IRIS, EPCI', 'Annuelle (résultats publiés en juin, avec trois ans de décalage)', 'CSV, Excel', 'Insee, Statistiques, Recensement, Résultats sur un territoire ; bases de données et fichiers détail', 'Séries historiques depuis 1968 pour la population, les logements, les ménages et l’emploi.'),
      s('Dossier complet (comparateur de territoire)', 'Insee', 'https://www.insee.fr/fr/statistiques/2011101', 'libre', 'Communes, EPCI, départements', 'Annuelle', 'Excel, HTML', 'Insee, Statistiques, Dossier complet, saisir la commune ou l’EPCI', 'Point de départ commode : plusieurs centaines d’indicateurs, toutes thématiques, au même endroit.'),
      s('État civil : naissances et décès', 'Insee', 'https://www.insee.fr', 'libre', 'Communes', 'Annuelle', 'CSV', 'Insee, Statistiques, Naissances et décès, fichiers détail ou séries communales', 'Nécessaires pour décomposer l’évolution en solde naturel et migratoire.'),
      s('Migrations résidentielles (fichier de flux)', 'Insee', 'https://www.insee.fr/fr/information/2008354', 'libre', 'Communes (flux d’origine et de destination)', 'Annuelle', 'CSV, fichier détail', 'Insee, Recensement, Bases de données et fichiers détail, Migrations résidentielles', 'Lieu de résidence un an auparavant ; les flux faibles sont regroupés ou masqués.'),
      s('Projections de population (Omphale)', 'Insee', 'https://www.insee.fr', 'libre', 'Départements, zones d’emploi', 'Révision périodique', 'Excel', 'Insee, Statistiques, Projections de population', 'Modèle de scénarios, pas de prévision.'),
      s('Fichiers détail individuels du recensement', 'Insee', 'https://www.insee.fr', 'mixte', 'Individus et ménages anonymisés, par grands territoires', 'Annuelle', 'CSV', 'Insee, fichiers détail (versions anonymisées libres) ; données plus fines via le Centre d’accès sécurisé aux données', 'La version fine (petits territoires) exige un accès sécurisé et une habilitation.')
    ],
    limites: [
      { t: 'Un recensement par enquête glissante', h: '<p>Depuis 2004, le recensement n’est plus une opération unique : les communes de moins de 10 000 habitants sont recensées de façon exhaustive, une fraction par an, sur un cycle de cinq ans ; les communes plus grandes font l’objet d’une enquête par sondage chaque année. Un « millésime » représente la situation à l’année médiane du cycle, et non une photographie instantanée. Les résultats sont publiés avec environ trois ans de décalage.</p>' },
      { t: 'Population municipale, comptée à part, totale', h: '<p>La population municipale (résidence habituelle) est la référence pour les évolutions. La population comptée à part (étudiants, personnes en établissement hors de leur commune) s’y ajoute pour former la population totale. Mélanger les deux fausse les taux d’évolution.</p>' },
      { t: 'Le solde migratoire est un résidu', h: '<p>Le solde migratoire « apparent » est calculé par différence entre l’évolution totale et le solde naturel ; il inclut donc les erreurs de mesure et les écarts entre sources (recensement, état civil). Il indique une tendance, pas un nombre exact d’arrivées et de départs.</p>' },
      { t: 'Millésimes récents et comparabilité', h: '<p>L’enquête de recensement de 2021 a été reportée à 2022 en raison de la crise sanitaire. L’Insee recommande de comparer le millésime 2023 seulement avec des données d’au moins six ans d’écart. Des comparaisons entre millésimes proches, ou de période trop courte, sont à proscrire.</p>' },
      { t: 'Migrations résidentielles : un instantané', h: '<p>Les flux résultent de la question sur la résidence un an (ou cinq ans, selon les fichiers) avant le recensement : les migrations intermédiaires ne sont pas saisies. Les flux sont bruts, non proportionnels à la durée ; les soldes sont plus robustes. Les petits flux sont masqués.</p>' },
      { t: 'Ménages et logements ordinaires', h: '<p>La taille moyenne des ménages porte sur les ménages ordinaires : elle exclut les personnes vivant en collectivité (maisons de retraite, internats, casernes). Dans un territoire où une caserne ou un établissement pèse lourd, l’interprétation demande de la prudence.</p>' },
      { t: 'Projections : des scénarios', h: '<p>Les projections de l’Insee (modèle Omphale) prolongent des hypothèses de fécondité, de mortalité et de migrations. Elles décrivent ce qui se passerait si ces hypothèses se réalisaient ; elles n’intègrent pas les politiques locales.</p>' }
    ],
    restit: [
      { type: 'Graphique', t: 'Évolution de la population et de ses composantes', quand: 'Montrer la trajectoire sur plusieurs décennies et l’origine de la croissance.', outils: {
        tableur: ['Construire un tableau par période intercensitaire : population de début et de fin, durée, solde naturel annuel moyen, solde migratoire annuel moyen (voir <a href="#/ateliers">atelier</a>).', 'Sélectionner les colonnes de soldes ; insérer un graphique en <b>colonnes empilées</b> (valeurs négatives en dessous de zéro).', 'Ajouter le taux global en courbe ou en étiquette : il se lit sur le même axe (taux en % par an).', 'Titrer avec le message (« La croissance repose sur le solde migratoire ») ; citer la source (Insee, recensements, état civil).'],
        magrit: ['Non adapté.'], qgis: ['Non adapté.'] }, piege: 'Ne jamais mettre sur un même axe des effectifs de population et des taux de variation.' },
      { type: 'Graphique', t: 'Pyramide des âges comparée', quand: 'Décrire la structure par âge et la comparer à un territoire de référence.', outils: {
        tableur: ['Récupérer les effectifs par tranche d’âge et par sexe (recensement, tranches quinquennales) ; calculer la part de chaque tranche dans la population totale.', 'Rendre les valeurs des hommes négatives (formule <code>=-B2</code>) afin de les placer à gauche.', 'Créer un graphique en <b>barres empilées horizontales</b> ; régler le chevauchement à 100 % et l’espacement des barres ; masquer le signe moins de l’axe par le format personnalisé <code>0,0%;0,0%</code>.', 'Superposer le territoire de référence en contour sans remplissage (ou en lignes) pour visualiser les écarts.', 'Inverser l’ordre de l’axe vertical si les jeunes doivent figurer en bas.'],
        magrit: ['Non adapté.'], qgis: ['Non adapté.'] } },
      { type: 'Carte', t: 'Évolution de la population, soldes naturel et migratoire par commune', quand: 'Localiser les dynamiques : où la croissance est-elle forte, d’où vient-elle ?', outils: {
        magrit: ['Importer le fond des communes et le tableau contenant les taux annuels moyens ; joindre (R2).', 'Choisir « Choroplèthe » sur le taux ; palette <b>divergente</b> (deux teintes) avec zéro comme valeur pivot pour l’évolution globale et pour les soldes.', 'Réaliser trois cartes (global, naturel, migratoire) avec des seuils <b>identiques</b> pour comparer.', 'Compléter par des cercles proportionnels pour le nombre absolu d’habitants gagnés ou perdus (R5).'],

      intro: '<p>Les revenus des ménages bornent leur capacité à se loger, à se déplacer, à se chauffer. Ils se lisent en niveau (revenu médian), en dispersion (inégalités, pauvreté) et en composition (activité, pensions, prestations). Les revenus se combinent avec le thème du logement pour estimer les besoins en logement social et l’accessibilité des marchés.</p>',

    limites: [
      { t: 'Revenu déclaré, revenu disponible, niveau de vie', h: '<p>Trois notions coexistent. Le <b>revenu déclaré</b> est celui de la déclaration fiscale (avant impôts et prestations). Le <b>revenu disponible</b> est ce dont dispose le ménage après impôts et prestations sociales. Le <b>niveau de vie</b> rapporte le revenu disponible aux unités de consommation. Utiliser la même notion pour toutes les communes et indiquer laquelle sur la carte.</p>' },
      { t: 'Le secret statistique', h: '<p>Les indicateurs de revenus ne sont publiés que si l’effectif est suffisant ; les petites communes et de nombreux IRIS sont en « secret statistique ». Ces cas doivent apparaître en couleur ou trame distincte, jamais comme zéro. Un carroyage de 200 m est souvent masqué en milieu peu dense.</p>' },
      { t: 'Ménages fiscaux : un champ particulier', h: '<p>Filosofi porte sur les ménages fiscaux ordinaires : les personnes sans domicile, celles vivant en collectivité et certains étudiants n’y figurent pas ou y figurent par le foyer de leurs parents. Le niveau de vie des communes universitaires ou des communes à forte présence d’étudiants est donc à lire avec précaution.</p>' },
      { t: 'Comparaisons entre millésimes', h: '<p>L’Insee invite à la prudence dans la comparaison locale de revenus d’une année à l’autre : les modifications de la législation et des sources influencent les évolutions. Le millésime 2021 ne prend pas pleinement en compte plusieurs mesures exceptionnelles (prime de pouvoir d’achat, fonds de solidarité, indemnité inflation). Comparer sur des périodes longues et avec prudence.</p>' },
      { t: 'Filosofi et Filocom ne mesurent pas la même chose', h: '<p>Filosofi (Insee) est produit à partir de sources fiscales et sociales, sur le champ des ménages fiscaux. Filocom (ministère du logement) est construit à partir des fichiers de la taxe d’habitation et des propriétés bâties, et rattache le ménage à son logement. Les taux issus de l’un ne se combinent pas avec ceux de l’autre sans précaution ; le PAC du PLH de la CAGG les utilise pour des objets distincts (pauvreté d’un côté, éligibilité au parc social de l’autre).</p>' },
      { t: 'Médiane communale et disparités internes', h: '<p>Une médiane communale masque les écarts internes : deux communes de même médiane peuvent contenir un quartier très pauvre et un quartier aisé. Compléter par le rapport interdécile ou une lecture par IRIS ou par carreau.</p>' }

    limites: [
      { t: 'Deux définitions de la vacance', h: '<p>Le recensement compte les logements vacants au moment de la collecte, selon la déclaration de l’enquêteur ou du ménage : la mesure est fragile (surestimation ou sous-estimation, y compris dans le cas d’un logement occupé de façon irrégulière). Le fichier LOVAC repère la vacance à partir de la taxe d’habitation ou de la taxe sur les logements vacants et distingue les durées (plus de un an, plus de deux ans, plus de cinq ans). Les deux ne mesurent pas la même chose ; l’un compte des logements sans occupant un jour donné, l’autre des logements du parc privé vacants depuis longtemps. Le taux « structurel » ne s’applique qu’au parc privé.</p>' },

    limites: [
      { t: 'DVF : une base brute à nettoyer', h: '<p>Chaque ligne décrit une mutation, mais une même mutation peut porter sur plusieurs lots, dépendances ou parcelles. Une vente d’une maison avec un garage et un terrain apparaît sur plusieurs lignes. Le calcul du prix au m² n’est fiable que pour les mutations portant sur un seul local d’habitation. Il faut également filtrer les ventes en l’état futur d’achèvement, les échanges et les adjudications, et écarter les prix aberrants (valeurs symboliques, ventes en bloc).</p>' },
      { t: 'Le prix ne dit pas la qualité', h: '<p>Un prix médian sur cinq ans mélange des biens de tailles, d’états et d’emplacements différents. La médiane rend mieux compte du marché que la moyenne, mais reste sensible à la composition des ventes (par exemple, davantage de petits logements une année donnée).</p>' },
      { t: 'Loyers : annonces, modèles et loyers signés', h: '<p>La Carte des loyers est un modèle calibré sur des annonces ; elle ne renseigne pas les loyers effectivement signés, souvent plus bas dans les baux anciens. Les observatoires locaux des loyers mesurent des loyers réels mais ne couvrent que certaines agglomérations.</p>' },
      { t: 'Autorisations, mises en chantier, livraisons', h: '<p>Un permis délivré n’est pas un logement construit. Le rythme de transformation des autorisations en mises en chantier varie selon la conjoncture. Le PAC du PLH mesure ici les logements autorisés sur cinq ans (2 524 logements dans la CAGG) ; il reste à les rapprocher des mises en chantier pour la production effective.</p>' },
      { t: 'Taille de l’échantillon et échelle communale', h: '<p>Dans les petites communes, quelques ventes annuelles suffisent à faire varier fortement la médiane. Regrouper les communes ou cumuler plusieurs années, et toujours afficher le nombre de transactions à côté du prix.</p>' }

    exemple: {
      intro: '<p>Le porter à connaissance du PLH de la CAGG compile les données DV3F, Sitadel et DDT 81. Deux constats se dégagent : un marché de maisons individuelles sur de grands terrains, et un renchérissement du foncier qui s’accompagne d’une réduction de la taille des parcelles.</p>',

      mission: '<p>Constituer, pour votre territoire, un <b>tableau de marché</b> (prix médian des maisons et des appartements, effectifs, surface, loyers) et une <b>carte des prix</b> avec effectifs. Conclure par un paragraphe sur l’accessibilité du marché aux ménages locaux, en mobilisant le revenu médian du thème Revenus.</p>',

  /* =============== 7. ÉCONOMIE ET EMPLOI =============== */
  M.chapter({
    id: 'economie', num: 7, part: 'B', short: 'Économie et emploi', title: 'Économie, emploi et tissu productif',
    card: 'Emplois, actifs, chômage, secteurs, établissements, zones d’activités.',
    kicker: 'Activités', duree: '45 min', niveau: 'Intermédiaire', outils: 'Tableur · Magrit · QGIS',
    resume: 'Décrire la population active, l’emploi présent sur le territoire, ses secteurs, son tissu d’établissements et ses zones d’activités. Ce thème explique les flux domicile-travail et la demande de foncier économique.',
    enjeux: {
      intro: '<p>Le territoire peut être décrit sous l’angle de ses <b>actifs résidents</b> (ceux qui y habitent, où qu’ils travaillent) ou de ses <b>emplois</b> (ceux qui y sont localisés, quels que soient leurs titulaires). Le rapport entre les deux, l’indice d’attractivité économique ou de concentration de l’emploi, distingue les pôles d’emploi des territoires résidentiels.</p><p>L’analyse est complétée par la structure sectorielle, la taille des établissements et le foncier économique (zones d’activités).</p>',
      questions: [

        { n: 'Répartition de l’emploi par secteur', f: 'emplois du secteur ÷ emplois totaux × 100', l: 'Nomenclature d’activités (NAF) : choisir un niveau agrégé (5 ou 10 postes) pour comparer.' },
        { n: 'Indice de spécificité sectorielle', f: '(part du secteur dans l’emploi local) ÷ (part du secteur dans l’emploi de référence)', l: 'Supérieur à 1 : sur-représentation du secteur. Précieux pour identifier les spécialisations.' },

        { n: 'Taux d’occupation des zones d’activités', f: 'surface de lots occupés ÷ surface totale × 100', l: 'Nécessite des données d’observatoire local (OZA) ou des fichiers foncier.' }

    sources: [
      s('Recensement de la population : activité et emploi', 'Insee', 'https://www.insee.fr/fr/statistiques', 'libre', 'Commune, IRIS', 'Annuelle (cumul de cinq ans)', 'CSV, Excel', 'Insee, rubrique Statistiques, thème Emploi, ou bases « Comparateur de territoire » et « Activité des résidents »', 'Actifs et emplois au lieu de travail sont deux bases distinctes ; celle sur l’emploi localisé ne donne pas les mêmes effectifs que le fichier des actifs.'),

    limites: [
      { t: 'Actifs résidents et emplois localisés : deux mesures qui ne se correspondent pas', h: '<p>Les actifs occupés sont comptés à leur lieu de résidence ; les emplois, à leur lieu de travail. La différence entre les deux se lit dans les flux domicile-travail. Comparer directement les deux effectifs sans le préciser induit des contresens : un territoire peut « perdre des emplois » simplement parce que ses habitants travaillent ailleurs.</p>' },
      { t: 'Chômage : trois définitions', h: '<p>Le chômage au sens du recensement repose sur une déclaration ; celui du BIT sur une enquête (Enquête Emploi) publiée à l’échelle de la zone d’emploi ; celui de France Travail sur l’inscription administrative. Les niveaux diffèrent et les évolutions ne se recoupent pas toujours.</p>' },
      { t: 'Nomenclature d’activités et changements de règles', h: '<p>La nomenclature (NAF rév. 2, avec niveaux de 5 à 732 postes) permet des regroupements différents selon le niveau retenu. Les séries longues doivent respecter une nomenclature constante. Vérifier également le changement de la définition de certaines catégories professionnelles (PCS).</p>' },

      intro: '<p>Un territoire vit par ses services : commerces de proximité, écoles, professionnels de santé, équipements sportifs et culturels, structures d’accueil. Leur répartition détermine l’attractivité résidentielle, la dépendance aux déplacements et l’égalité d’accès. L’analyse s’appuie sur la <b>gamme</b> des équipements (proximité, intermédiaire, supérieure), sur la <b>couverture</b> (part de la population à moins de X minutes) et sur la <b>densité</b> (équipements pour 1 000 habitants).</p><p>La santé est traitée à part : l’offre de médecins généralistes, son vieillissement et l’accessibilité potentielle localisée sont des indicateurs décisifs dans les territoires ruraux.</p>',

    enjeux: {
      intro: '<p>Le foncier est au croisement des thèmes du logement, de l’économie et de l’environnement. Il se décrit de deux manières : par l’<b>occupation du sol</b> (ce que recouvre le territoire : forêts, cultures, tissu urbain) et par les <b>usages</b> (résidentiel, économique, agricole). La loi Climat et résilience de 2021 fixe une trajectoire de réduction de la consommation d’espaces naturels, agricoles et forestiers (NAF) puis d’absence d’artificialisation nette en 2050, et donne à cette mesure une dimension réglementaire ; la présente fiche s’en tient à la méthode de mesure et à ses limites.</p><p>On distingue plusieurs notions qui ne se recoupent pas : la <b>consommation d’espaces NAF</b> (création ou extension effective d’espaces urbanisés), l’<b>artificialisation</b> (altération durable des fonctions du sol) et l’<b>imperméabilisation</b>. Chacune repose sur des sources et des seuils différents.</p>',
      questions: [
        'Comment le territoire est-il occupé (part de l’agricole, du forestier, de l’urbanisé) et comment cela a-t-il évolué ?',

        'Quelle surface moyenne est consommée par logement neuf, par habitant accueilli, par emploi créé ?',
        'Quels gisements de renouvellement existent (friches, logements vacants, dents creuses, zones d’activités vacantes) ?',

    limites: [
      { t: 'Consommation, artificialisation, imperméabilisation : trois notions', h: '<p>La consommation d’espaces NAF mesure le passage d’un espace naturel, agricole ou forestier à un espace urbanisé. L’artificialisation évalue l’altération des fonctions écologiques d’un sol (jardins urbains, pelouses, parcs exclus ou non selon la nomenclature). L’imperméabilisation compte les sols scellés. Un même territoire peut afficher trois chiffres différents pour la même période, sans contradiction.</p>' },
      { t: 'La méthode change le chiffre', h: '<p>Le PAC du PLH de la CAGG rapporte que la consommation effective de l’intercommunalité (129 ha entre 2021 et 2024) représente 48 % de l’enveloppe de 271 ha prévue par le SCoT pour 2021-2031. Avec la méthode du portail de l’artificialisation et l’objectif régional de réduction de 55,3 %, la même consommation atteint 82 % de l’objectif décennal. Le résultat dépend donc de la source, de la période et de la définition de l’objectif : il faut toujours expliciter les trois.</p>' },
      { t: 'Fichiers fonciers : une donnée fiscale', h: '<p>La consommation d’espaces mesurée par les fichiers fonciers repose sur des changements de nature fiscale des parcelles. Elle est en retard sur les chantiers réels et peut manquer certains équipements (routes, voiries non taxées). L’OCS GE, fondée sur l’observation de photographies aériennes, complète cette mesure.</p>' },
      { t: 'Nomenclatures et échelles d’occupation du sol', h: '<p>Corine Land Cover est trop grossière pour l’échelle communale (unité minimale de 25 ha, avec un seuil de 5 ha pour les changements). L’OCS GE est plus fine mais couvre inégalement le territoire et ses millésimes ne sont pas toujours comparables entre départements. Ne jamais comparer des données de nomenclatures différentes sans table de passage.</p>' },
      { t: 'Consommation ponctuelle et cycle du foncier', h: '<p>La consommation d’une année dépend de quelques grandes opérations (zone d’activités, lotissement, infrastructure). Une moyenne annuelle sur dix ans est plus robuste. Rapporter la surface aux logements ou aux habitants pour éviter d’interpréter une seule année atypique.</p>' }

      intro: '<p>Le diagnostic des milieux articule quatre niveaux d’information qui ne doivent pas être confondus : les <b>milieux</b> eux-mêmes (occupation du sol, forêts, zones humides, prairies), les <b>zonages</b> de protection (Natura 2000, arrêtés de protection, réserves) et d’inventaire (ZNIEFF), les <b>espèces</b> observées (bases naturalistes) et les <b>fonctionnalités</b> (continuités écologiques, trame verte et bleue). Un zonage ne dit pas l’état du milieu, une base d’espèces ne dit pas l’absence d’une espèce et une continuité modélisée n’est pas un fait observé.</p><p>L’agriculture est à traiter dans ce thème : première occupation du sol de la plupart des territoires, elle façonne les paysages et les milieux, et dépend des sols et de l’eau.</p>',

      { t: 'Zonage, état, protection : trois idées distinctes', h: '<p>Un périmètre ZNIEFF est un inventaire scientifique sans portée juridique directe ; Natura 2000 est un réseau européen de sites avec obligation de gestion ; un arrêté de biotope est une protection réglementaire. Les cartes qui superposent ces périmètres sans les distinguer conduisent à des lectures erronées. Le calcul de la « surface protégée » doit préciser le type de zonage et dissoudre les recouvrements.</p>' },
      { t: 'Biais d’observation des bases d’espèces', h: '<p>Le nombre d’espèces observées dépend d’abord du nombre d’observateurs, de la proximité des sentiers et de l’intérêt taxonomique. Une commune « riche » est souvent une commune bien prospectée. Toujours rapporter la richesse spécifique au nombre d’observations ou de jours d’observation, et présenter les résultats en mailles plutôt qu’en communes.</p>' },
      { t: 'Échelle et date des inventaires', h: '<p>Les ZNIEFF, zones humides et corridors sont établis à des échelles très différentes (1/25 000 à 1/100 000) et à des dates variées ; leur précision n’autorise pas à raisonner à la parcelle. Ils sont enrichis par des inventaires locaux dont il faut demander la version à jour.</p>' },

        ]) + M.co('tip', 'Ce que montre cette démarche', '<p>Le schéma régional de cohérence écologique de Midi-Pyrénées n’identifiait qu’un réseau assez simple ; l’étude locale a défini cinq sous-trames à partir des habitats décrits dans les fiches Natura 2000 et ZNIEFF, puis a localisé réservoirs et corridors par des critères de surface et de continuité. Une trame verte et bleue est donc une <b>modélisation</b>, reposant sur des choix de méthode qu’il faut pouvoir décrire (critères, seuils, sources).</p>') + M.co('def', 'Trame noire', '<p>Le document ajoute une trame noire, qui cartographie la continuité de l’obscurité nocturne : la lumière artificielle constitue une barrière ou un piège pour la faune nocturne (environ 30 % des vertébrés et 65 % des invertébrés ont une activité nocturne selon le document). Les données de base sont la localisation des sources lumineuses et l’occupation du sol.</p>') },

        { titre: 'Pas à pas : la part du territoire en zonage d’inventaire', html: M.steps(['Télécharger les ZNIEFF de type I et II du département (INPN) et les limites communales (Admin Express).', 'Reprojeter les deux couches en Lambert-93 (EPSG:2154) ; dissoudre les ZNIEFF par type.', 'Effectuer l’intersection avec les communes (<i>Vecteur &gt; Géotraitement &gt; Intersection</i>) et calculer la surface recouverte (<code>$area</code>).', 'Diviser par la surface communale pour obtenir la part couverte ; joindre au fond des communes (R2).', 'Cartographier avec quatre classes ; ajouter le nombre de zonages en symboles.', 'Rédiger la lecture : quelles communes cumulent forte couverture et forte pression d’urbanisation (croiser avec le thème Foncier) ?']) + M.co('tip', 'Passerelle vers R', '<p>Le même traitement s’écrit en quelques lignes avec le paquet <code>sf</code> : lecture des couches (<code>st_read</code>), intersection (<code>st_intersection</code>), calcul de surface (<code>st_area</code>) et cartographie avec <code>mapsf</code>. Le paquet <code>rinpn</code> ou l’API OpenObs peut alimenter la partie espèces.</p>') }
