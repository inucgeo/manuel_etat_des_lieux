  /* =============== 12. EAU =============== */
  M.chapter({
    id: 'eau', num: 12, part: 'B', short: 'Eau et milieux aquatiques', title: 'Ressource en eau, qualité et services d’eau',
    card: 'Masses d’eau, qualité, prélèvements, eau potable, assainissement, gestion.',
    kicker: 'Environnement', duree: '60 min', niveau: 'Intermédiaire à avancé', outils: 'Tableur · QGIS · R',
    resume: 'Décrire les ressources en eau (cours d’eau, nappes), leur état, les pressions qui s’exercent sur elles (prélèvements, rejets, pollutions diffuses), ainsi que les services d’eau potable et d’assainissement. Chapitre destiné en priorité à la spécialité GSE.',
    enjeux: {
      intro: '<p>L’eau est un système : elle circule d’un amont vers un aval, s’infiltre, ruisselle, se pollue et se prélève. Son étude ne suit donc pas les limites communales mais celles des <b>bassins versants</b> et des <b>masses d’eau</b>, unités de la directive-cadre sur l’eau. Le diagnostic distingue les <b>ressources</b> (débits, niveaux de nappe), l’<b>état</b> (qualité physico-chimique, biologique, chimique), les <b>pressions</b> (prélèvements, rejets, artificialisation) et les <b>services</b> (eau potable, assainissement).</p><p>Les données sont de nature très différente : stations de mesure ponctuelles, périmètres de masses d’eau, indicateurs de performance des services, données sanitaires. Le travail consiste à les mettre en relation avec le territoire d’étude.</p>',
      questions: [
        'Quels cours d’eau et nappes concernent le territoire, et à quelles masses d’eau appartiennent-ils ?',
        'Quel est l’état écologique et chimique de ces masses d’eau, et quelles sont les pressions identifiées ?',
        'Comment évoluent les débits, les niveaux de nappe, les épisodes de sécheresse ?',
        'Quels sont les prélèvements par usage (eau potable, irrigation, industrie) et la balance avec la ressource disponible ?',
        'Les services d’eau potable et d’assainissement sont-ils performants (rendement, conformité, prix) ?'
      ],
      indicateurs: [
        { n: 'État écologique et chimique des masses d’eau', f: 'classes de qualité (très bon, bon, moyen, médiocre, mauvais)', l: 'Établi tous les six ans par les agences de l’eau ; lecture par masse d’eau, non par commune.' },
        { n: 'Concentration en nitrates, pesticides, phosphore (stations)', f: 'valeurs mesurées ÷ norme (mg/L)', l: 'Mesures ponctuelles ; à lire en séries, avec le nombre de mesures.' },
        { n: 'Niveau piézométrique (nappes)', f: 'profondeur du niveau d’eau (m) par rapport au sol ou cote NGF', l: 'À comparer à des références saisonnières (moyennes interannuelles) ; la tendance compte plus que la valeur.' },
        { n: 'Volumes prélevés par usage', f: 'somme annuelle en m³ par usage (eau potable, irrigation, industrie)', l: 'Seuls les prélèvements déclarés au-dessus de seuils sont connus.' },
        { n: 'Rendement du réseau d’eau potable', f: 'volume consommé et vendu ÷ volume mis en distribution × 100', l: 'Indicateur de performance ; un rendement inférieur à un seuil réglementaire déclenche un plan d’actions.' },
        { n: 'Conformité de l’eau distribuée, de l’assainissement', f: 'nombre de prélèvements conformes ÷ total × 100', l: 'Séparer microbiologie et physico-chimie ; distinguer collectif et non collectif.' }
      ],
      liens: [['foncier', 'l’imperméabilisation modifie le ruissellement et les recharges.'], ['milieux', 'les zones humides et les cours d’eau sont des milieux à enjeu.'], ['risques', 'inondations, sécheresses et retrait-gonflement des argiles relèvent du cycle de l’eau.'], ['climat', 'le changement climatique agit sur les débits, les nappes et la demande.']]
    },
    sources: [
      s('Hub’Eau (API de données sur l’eau)', 'OFB, BRGM, Sandre', 'https://hubeau.eaufrance.fr', 'libre', 'Station, masse d’eau, commune (selon la thématique)', 'Continue', 'JSON, CSV, GeoJSON', 'Site hubeau.eaufrance.fr ; requêtes par URL dans un tableur, QGIS ou R (paquet <code>hubeau</code>)', 'Thématiques : qualité des rivières, qualité des nappes, piézométrie, hydrométrie, prélèvements, écoulements (ONDE), eau potable.'),
      s('Naïades et ADES', 'Eaufrance', 'https://naiades.eaufrance.fr', 'libre', 'Station', 'Continue', 'CSV', 'Portail Naïades (eaux de surface), ADES (eaux souterraines)', 'Données brutes de qualité et de piézométrie ; unités et seuils à contrôler.'),
      s('Banque nationale des prélèvements quantitatifs en eau (BNPE)', 'OFB, agences de l’eau', 'https://bnpe.eaufrance.fr', 'libre', 'Ouvrage, commune', 'Annuelle', 'CSV', 'Portail BNPE ou Hub’Eau', 'Prélèvements déclarés ou redevables de l’agence de l’eau, pas exhaustifs.'),
      s('Référentiel des masses d’eau et état des lieux du bassin (SDAGE)', 'Agences de l’eau, Sandre', 'https://www.sandre.eaufrance.fr', 'libre', 'Masses d’eau (polygones, tronçons)', 'Cycles de 6 ans', 'Shapefile, tableaux', 'Site de l’agence de l’eau du bassin (par exemple Adour-Garonne) et Sandre', 'Le SDAGE et les SAGE ont une portée réglementaire ; on n’en retient ici que l’état des lieux chiffré.'),
      s('Observatoire national des services d’eau et d’assainissement (SISPEA)', 'OFB, ministère chargé de l’environnement', 'https://www.services.eaufrance.fr', 'libre', 'Service (collectivité)', 'Annuelle', 'CSV, fiches', 'Site services.eaufrance.fr, fiches et téléchargement par service', 'Rapports annuels des collectivités ; complétude variable.'),
      s('Résultats du contrôle sanitaire de l’eau potable', 'ARS, ministère chargé de la santé', 'https://www.data.gouv.fr', 'libre', 'Réseau, commune', 'Continue', 'CSV', 'data.gouv.fr, « Résultats du contrôle sanitaire de l’eau distribuée commune par commune »', 'Chaque prélèvement est décrit paramètre par paramètre : nécessite un agrégat.'),
      s('Portail de l’assainissement communal', 'Ministère de la transition écologique', 'https://www.assainissement.developpement-durable.gouv.fr', 'libre', 'Station d’épuration', 'Annuelle', 'Tableaux, CSV', 'Portail de l’assainissement communal', 'Conformité en équipement et en performance ; distinguer l’assainissement non collectif.'),
      s('Restrictions d’usage de l’eau (Propluvia), Vigicrues, Infoclimat', 'Ministère de la transition écologique, Vigicrues', 'https://propluvia.developpement-durable.gouv.fr', 'libre', 'Zone d’alerte, station', 'Continue', 'Cartes, historiques', 'Sites Propluvia et Vigicrues ; historiques téléchargeables', 'Les arrêtés préfectoraux définissent des niveaux d’alerte ; l’historique est utile pour mesurer la fréquence des restrictions.')
    ],
    limites: [
      { t: 'Une donnée ponctuelle pour un territoire continu', h: '<p>Les mesures proviennent de stations. Rapprocher une station d’un territoire communal suppose de définir un bassin versant amont ou une masse d’eau. Une station située à la limite du territoire ne caractérise pas nécessairement ses cours d’eau internes.</p>' },
      { t: 'État des masses d’eau : un cycle de six ans', h: '<p>L’état écologique est actualisé tous les six ans à l’occasion du cycle de gestion. Entre deux cycles, la qualité peut évoluer sans que la classe change. Le classement est déterminé par l’élément le plus déclassant (« règle du pire ») : une masse d’eau « moyenne » peut être bonne sur presque tous les paramètres sauf un.</p>' },
      { t: 'Séries de mesures irrégulières', h: '<p>Les fréquences de suivi diffèrent d’une station à l’autre, et des limites de quantification (valeur « inférieure à ») compliquent les statistiques : ne pas remplacer un résultat inférieur à la limite par zéro sans convention explicite. Vérifier les unités et les seuils réglementaires (eau potable, milieu naturel) dont les valeurs diffèrent.</p>' },
      { t: 'Prélèvements : déclarations et seuils', h: '<p>Seuls les prélèvements soumis à déclaration ou à redevance apparaissent dans la BNPE : les petits prélèvements domestiques ou agricoles échappent à la statistique. Le niveau d’usage réel est sous-estimé, en particulier pour l’irrigation.</p>' },
      { t: 'Indicateurs de service : déclaratif et hétérogène', h: '<p>Les indicateurs de performance des services d’eau (rendement, indice linéaire de pertes) sont déclarés par les collectivités. Toutes ne les renseignent pas et les périmètres de service ne suivent pas les limites communales. Rapprocher les périmètres de service et les communes par une table de correspondance.</p>' }
    ],

        qgis: ['Télécharger les masses d’eau superficielles (tronçons) et leur état (Sandre, agence de l’eau) ; joindre le tableau d’état par code de masse d’eau.', 'Symbologie catégorisée sur l’état écologique avec les couleurs conventionnelles de la directive-cadre (bleu, vert, jaune, orange, rouge) ; épaissir les traits pour la lisibilité.', 'Superposer les limites du territoire et les stations de mesure.'],
        magrit: ['Importer les tronçons avec l’état codé ; représentation « Typologie ».'],
        tableur: ['Tableau : masse d’eau, catégorie, état écologique, paramètre déclassant, échéance d’objectif.'] }, piege: 'Ne pas colorer les communes : l’état est une propriété de la masse d’eau.' },
      { type: 'Graphique', t: 'Chronique de qualité ou de niveau (station)', quand: 'Suivre l’évolution d’un paramètre (nitrates, piézométrie).', outils: {

    exemple: {
      intro: '<p>L’état initial de l’environnement du SCoT de la CA Gaillac-Graulhet (approuvé en février 2026) rassemble de nombreuses données sur l’eau : masses d’eau, prélèvements, captages, nappes, assainissement. Elles sont reprises ci-dessous pour illustrer les indicateurs du chapitre. Le territoire dépend principalement du bassin du Tarn (avec l’Agout et le Dadou) et relève du SDAGE Adour-Garonne 2022-2027.</p>',
      blocs: [
        { titre: 'Des masses d’eau au bon état chimique mais à l’état écologique dégradé', charts: [{ mode: 'h', title: 'Nombre de masses d’eau « rivière » dégradées, sur 41 (SDAGE Adour-Garonne 2022-2027)', cats: ['Mauvais état chimique', 'État écologique moyen à médiocre'], series: [{ name: 'Masses d’eau', values: [5, 36] }], unit: 'masses d’eau', ref: { label: 'Total : 41', value: 41 }, src: EIE + ', partie 5.2.1' }],
          lecture: 'Sur 41 masses d’eau superficielles, 5 seulement sont en mauvais état chimique, mais 36 ont un état écologique moyen à médiocre. Deux mesures différentes, deux messages différents : l’état chimique porte sur le respect de normes pour 41 substances, l’état écologique sur des éléments biologiques, physico-chimiques et hydromorphologiques. Le document relie l’état écologique à l’altération des cours d’eau (obstacles), aux pollutions diffuses (azote et pesticides), aux rejets de stations d’épuration et aux prélèvements pour l’irrigation. Les secteurs les plus dégradés sont le Tarn en amont de Gaillac, le Dadou en amont de Graulhet et l’Agout.', src: EIE },
        { titre: 'Prélèvements : l’irrigation domine et dépend du climat', charts: [{ mode: 'h', title: 'Prélèvements d’eau moyens 2017-2021 selon l’usage (millions de m³ par an)', cats: ['Irrigation', 'Eau potable', 'Industrie'], series: [{ name: 'Volume moyen annuel', values: [10.85, 5.14, 1.66] }], dec: 2, unit: 'Mm³', src: EIE + ' (données Agence de l’eau Adour-Garonne) ; total moyen 17,66 Mm³, soit 61,5 %, 29,1 % et 9,4 %' }, { mode: 'grouped', title: 'Variabilité des prélèvements : 2020 et 2021 (millions de m³)', cats: ['2020', '2021'], series: [{ name: 'Prélèvements totaux', values: [20.4, 14.8] }, { name: 'dont irrigation', values: [13.6, 8.2] }], dec: 1, unit: 'Mm³', src: EIE + ' ; irrigation 2017-2019 : entre 10,4 et 11,4 Mm³' }],
          lecture: 'Sur la période 2017-2021, 17,7 millions de m³ sont prélevés chaque année, dont 61,5 % pour l’irrigation. La variabilité interannuelle vient presque entièrement de l’irrigation, tributaire de la pluviométrie : de 8,2 Mm³ en 2021 à 13,6 Mm³ en 2020. Une moyenne sur cinq ans lisse ces écarts, mais ne dit rien de la pression à l’étiage. Le document précise aussi que tout le territoire est classé en zone de répartition des eaux depuis 1996, ce qui traduit une insuffisance chronique de la ressource par rapport aux besoins.', src: EIE },
        { titre: 'Capacité résiduelle des captages d’eau potable', charts: [{ mode: 'h', title: 'Capacité résiduelle des captages du territoire (% du volume autorisé non prélevé en 2021)', cats: ['Forage des Abriols (Larroque)', 'Prise d’eau du Tarn (Rivières)', 'Prise d’eau du Tarn (Rabastens)', 'Moulin d’Alos', 'Prise d’eau de Saint-Roch', 'Puits de Sesquière (Vieux)', 'Forage de Guirbonde (Itzac)'], series: [{ name: 'Capacité résiduelle', values: [89.3, 75.1, 71.8, 70.5, 66.7, 65.8, 54.8] }], dec: 1, unit: '%', src: EIE + ' (RPQS des gestionnaires et Agence de l’eau, 2021)' }],
          lecture: 'La capacité résiduelle, calculée comme 1 − (volume prélevé ÷ volume autorisé), va de 55 % à 89 % selon les captages : au regard de ce seul indicateur, le territoire pourrait accueillir de nouveaux habitants. Mais l’indicateur compare un prélèvement à une autorisation administrative, non à la disponibilité réelle de la ressource à l’étiage ni à sa qualité : il ne suffit pas, à lui seul, à conclure sur la sécurité d’approvisionnement.', src: EIE },
        { titre: 'Nappes : le ratio prélèvements / recharge', charts: [{ mode: 'h', title: 'Ratio volume consommé / recharge estimée de deux nappes profondes (%)', cats: ['Nappe FRFG082D (usage industriel dominant)', 'Nappe FRFG080C (eau potable dominante)'], series: [{ name: 'Volume consommé / recharge', values: [841, 129] }], unit: '%', ref: { label: 'Équilibre : 100 %', value: 100 }, src: EIE + ', partie 5.2.2' }],
          lecture: 'Deux masses d’eau souterraine ont un état quantitatif dégradé : les prélèvements dépassent la recharge estimée (841 % et 129 %). Ces nappes s’étendent bien au-delà du territoire (9 174 et 16 998 km²) : le ratio est calculé sur toute la masse d’eau, non sur la CAGG. Une donnée d’état est donc rattachée à une masse d’eau, pas à une commune, et ne peut être imputée à un usage local sans précaution.', src: EIE },
        { titre: 'Assainissement collectif : un parc de stations très morcelé', charts: [{ mode: 'h', title: 'Stations d’épuration de la CAGG selon leur capacité (nombre, sur 51)', cats: ['Plus de 10 000 EH (Gaillac, Graulhet)', 'De 2 000 à 10 000 EH', 'De 200 à 2 000 EH', 'Moins de 200 EH'], series: [{ name: 'Stations', values: [2, 2, 26, 21] }], unit: 'stations', src: EIE + ', partie 6.2.1' }],
          lecture: 'Sur 51 stations, 47 ont une capacité inférieure à 2 000 équivalents-habitants. Le document souligne que les charges maximales entrantes ne sont connues que pour 27 stations et les résultats de conformité que pour 36 : la lacune de données est elle-même un résultat. À Lisle-sur-Tarn, la charge maximale (3 093 EH en 2020) dépasse la capacité nominale (2 500 EH).', src: EIE },
        { titre: 'Repères hydrologiques des cours d’eau', html: M.table(['Cours d’eau (station)', 'Module (m³/s)', 'Débit instantané minimum', 'Débit instantané maximum'], [
          ['Tarn (Rabastens)', '159', '0,094 m³/s (22 février 1984)', '4 110 m³/s (16 décembre 1996)'],
          ['Agout (Saint-Lieux-lès-Lavaur)', '50,6', '1,50 m³/s (30 octobre 2021)', '1 070 m³/s (12 mai 2020)'],
          ['Dadou (Graulhet)', '9,33', '0,248 m³/s (31 août 2021)', '583 m³/s (11 mai 2020)']
        ]) + M.co('def', 'Module et étiage', '<p>Le <b>module</b> est le débit moyen interannuel d’un cours d’eau. L’<b>étiage</b> est la période de basses eaux, en été, où les prélèvements pèsent le plus. Ces valeurs proviennent des banques nationales (Hydroportail) ; seules trois stations sont situées sur le territoire ou à sa limite, et aucune pour la Vère et le Tescou : la connaissance hydrologique est très inégale.</p>') },
        { titre: 'Fiche type : le système eau du territoire', html: M.table(['Rubrique', 'Question', 'Source', 'Restitution'], [

        { titre: 'Pas à pas : interroger Hub’Eau depuis un tableur et depuis R', html: M.steps(['Ouvrir la documentation de Hub’Eau et choisir l’API voulue (par exemple « Qualité des rivières » ou « Piézométrie »).', 'Construire l’URL de la requête : identifiant de la station ou de la commune, période et paramètre (noms des champs dans la documentation de l’API), en ajoutant <code>format=csv</code>.', 'Dans le tableur : <i>Données &gt; Depuis le Web</i> (ou <i>Insérer &gt; Lien vers données externes</i> dans LibreOffice) ; enregistrer le résultat en tableau de travail.', 'Dans R : <code>library(hubeau)</code> puis les fonctions dédiées ; enregistrer dans un fichier CSV daté avec la date d’interrogation.', 'Contrôler les unités, les limites de quantification et le nombre de mesures ; tracer la chronique avec une référence.']) + M.co('warn', 'Reproductibilité', '<p>Les API renvoient des données qui évoluent : toujours enregistrer la date de téléchargement, l’URL de la requête et la version du fichier. C’est la condition pour retrouver un chiffre plus tard.</p>') }

        { q: 'Que signifie la « règle du pire » dans le classement de l’état écologique ?', o: ['On retient la valeur moyenne des paramètres', 'On retient le paramètre le plus déclassant', 'On retient le dernier paramètre mesuré', 'On exclut le paramètre le plus mauvais'], a: 1, e: 'Le classement final est celui de l’élément de qualité le plus défavorable : une masse d’eau peut être « moyenne » à cause d’un seul paramètre.' },

<script>

  /* =============== 13. CLIMAT, ÉNERGIE, AIR =============== */
  M.chapter({
    id: 'climat', num: 13, part: 'B', short: 'Climat, énergie, air', title: 'Climat, énergie, émissions et qualité de l’air',
    card: 'Climat actuel et futur, consommations d’énergie, émissions de gaz à effet de serre, DPE, énergies renouvelables, air.',
    kicker: 'Environnement', duree: '60 min', niveau: 'Intermédiaire à avancé', outils: 'Tableur · QGIS · R',
    resume: 'Décrire le climat observé et ses évolutions, les consommations d’énergie et les émissions de gaz à effet de serre par secteur, la performance énergétique du parc de logements, la production d’énergies renouvelables et la qualité de l’air. Chapitre destiné en priorité à la spécialité GSE.',
    enjeux: {
      intro: '<p>Le diagnostic climat-air-énergie relie des variables physiques (températures, précipitations), des flux (énergie consommée et produite, gaz à effet de serre émis) et des stocks (bâtiments, forêts qui stockent du carbone). Il se déploie sous trois angles : l’<b>atténuation</b> (réduire consommations et émissions), l’<b>adaptation</b> (réduire la vulnérabilité aux effets du changement climatique) et la <b>qualité de l’air</b>, dont les sources coïncident en partie avec celles des émissions de gaz à effet de serre (transports, chauffage, agriculture).</p><p>Le logement joue un rôle central : la performance énergétique du parc, appréciée par le diagnostic de performance énergétique (DPE), détermine la consommation, les émissions, la précarité énergétique et les besoins de rénovation.</p>',
      questions: [
        'Quelles sont les caractéristiques du climat local, et comment évoluent températures, précipitations, épisodes de chaleur ?',
        'Quels sont les scénarios d’évolution du climat à moyen et long terme pour le territoire ?',
        'Combien d’énergie est consommée, par secteur et par énergie, et quelles émissions de gaz à effet de serre en résultent ?',
        'Quelle est la performance énergétique du parc de logements et des bâtiments publics ?',
        'Quelle production d’énergies renouvelables, quel potentiel ?',
        'Quelle est la qualité de l’air, quelles sont les sources de polluants ?'
      ],
      indicateurs: [
        { n: 'Température moyenne annuelle et anomalies', f: 'moyenne annuelle − moyenne de référence (1961-1990 ou 1991-2020)', l: 'Une station représente un secteur ; choisir la référence et la préciser.' },
        { n: 'Nombre de jours de forte chaleur (≥ 35 °C), de nuits tropicales', f: 'comptage annuel de jours dépassant le seuil', l: 'Indicateurs simples pour l’adaptation ; disponibles observés et projetés.' },
        { n: 'Consommation d’énergie finale par habitant et par secteur', f: 'GWh ÷ habitants (résidentiel, tertiaire, transports, agriculture, industrie)', l: 'Les données de consommation communale sont soumises au secret statistique ; les transports sont modélisés.' },
        { n: 'Émissions de gaz à effet de serre par secteur', f: 'tonnes équivalent CO₂ (kteqCO₂), par habitant', l: 'Inventaires modélisés (méthodes descendantes) ; périmètre (scopes 1, 2, 3) à préciser.' },
        { n: 'Part des logements par étiquette DPE', f: 'logements de l’étiquette ÷ logements diagnostiqués × 100', l: 'Les logements diagnostiqués ne représentent pas tout le parc ; le DPE a changé de méthode en 2021.' },
        { n: 'Production d’énergies renouvelables', f: 'GWh produits par filière ÷ consommation finale × 100', l: 'Les installations de moins de 36 kVA sont estimées ; les filières bois et chaleur sont mal connues.' },
        { n: 'Concentrations en polluants (NO₂, PM10, PM2,5, O₃)', f: 'moyenne annuelle en µg/m³ ; nombre de jours de dépassement', l: 'Stations rares en milieu rural ; les cartes de modélisation comblent l’absence de mesure.' }
      ],
      liens: [['parc', 'l’ancienneté et la performance du parc déterminent consommations et émissions.'], ['mobilites', 'les transports pèsent fortement dans les émissions.'], ['risques', 'les aléas (canicule, sécheresse, inondation) évoluent avec le climat.'], ['eau', 'le climat agit sur les débits, les nappes et la demande.'], ['milieux', 'les milieux stockent du carbone et sont sensibles aux évolutions.']]
    },
    sources: [
      s('DRIAS – Les futurs du climat', 'Météo-France, Ipsl, Cerfacs', 'https://www.drias-climat.fr', 'libre', 'Maille de 8 km (indicateurs), point de grille', 'Ensemble de projections régionalisées (dernier jeu à vérifier)', 'Cartes, CSV, NetCDF', 'Portail DRIAS : rubrique « Accompagnement » (indicateurs pré-calculés) ou « Espace Découverte »', 'Résultats de modèles selon des scénarios d’émission : ce sont des projections et non des prévisions.'),
      s('Climadiag Commune et données climatologiques de Météo-France', 'Météo-France', 'https://meteofrance.com/climadiag-commune', 'libre', 'Commune, station', 'Continue', 'Cartes, CSV', 'Climadiag Commune ; « Données climatologiques de base » sur data.gouv.fr et le portail Météo-France', 'Stations parfois éloignées du territoire : documenter la station et la période.'),
      s('Inventaires territoriaux des émissions et de l’énergie (Atmo régional, observatoire régional)', 'Associations agréées de surveillance de la qualité de l’air (Atmo), observatoires régionaux', 'https://www.atmo-france.org', 'libre', 'Commune, EPCI', 'Annuelle (avec deux ans de retard)', 'CSV, tableaux', 'Site de l’Atmo régional ou de l’observatoire régional de l’énergie (données ouvertes)', 'Méthode d’inventaire (cadre PCIT), millésime et secteurs à vérifier ; les émissions ne sont pas mesurées mais calculées.'),
      s('Données locales de consommation et de production d’énergie (SDES, Enedis, GRDF, RTE)', 'SDES, gestionnaires de réseaux', 'https://data.enedis.fr', 'libre', 'Commune, IRIS, EPCI', 'Annuelle', 'CSV', 'Portails open data (Enedis, GRDF, Open Data Réseaux Énergies) et SDES « Données locales »', 'Secret statistique : données masquées si peu de clients ou si un client concentre la consommation.'),
      s('Observatoire des diagnostics de performance énergétique (DPE)', 'ADEME', 'https://data.ademe.fr', 'libre', 'Logement (adresse), commune', 'Continue', 'CSV, API', 'Portail data.ademe.fr, jeux « DPE logements existants » (méthode postérieure à 2021) et « DPE logements existants avant juillet 2021 »', 'Les DPE ne couvrent qu’une partie du parc (logements vendus, loués, neufs) ; les fichiers d’avant et d’après 2021 ne sont pas comparables.'),
      s('Base de données nationale des bâtiments (BDNB)', 'CSTB', 'https://bdnb.io', 'mixte', 'Bâtiment', 'Trimestrielle', 'GeoPackage, CSV', 'Site bdnb.io, téléchargement départemental ; accès complet sous conditions', 'Estimation modélisée de la performance énergétique de l’ensemble du parc : à distinguer des DPE réels.'),
      s('SINOE (données sur les déchets) et rapports des syndicats de traitement', 'ADEME, syndicats (par exemple Trifyl dans le Tarn)', 'https://www.sinoe.org', 'libre', 'Collectivité de collecte, installation', 'Annuelle', 'Tableaux, CSV', 'Site sinoe.org (base nationale) ; rapports annuels sur le prix et la qualité du service', 'Les périmètres de collecte ne suivent pas les EPCI ; les déchetteries sont souvent traitées à part.'),
      s('Précarité énergétique (ONPE, Filosofi, Filocom)', 'Observatoire national de la précarité énergétique', 'https://onpe.org', 'mixte', 'Commune, IRIS', 'Annuelle', 'Rapports, tableaux', 'Site de l’ONPE ; fichiers Filocom (DDT, Cerema) ; indicateurs Insee', 'Trois approches (taux d’effort, bas revenus et dépenses élevées, ressenti) donnent des taux différents.'),
      s('Qualité de l’air : mesures et modélisation', 'Atmo régional, LCSQA', 'https://www.geodair.fr', 'libre', 'Station, maille', 'Continue', 'CSV, cartes', 'Site de l’Atmo régional ; Géod’Air pour les mesures nationales', 'Stations concentrées en zones urbaines : préférer les cartes modélisées pour les communes rurales.')
    ],
    limites: [
      { t: 'Observation, projection, prévision', h: '<p>Les données climatologiques observées décrivent le passé. DRIAS fournit des projections issues de modèles selon des trajectoires d’émission : elles disent ce qui se passerait sous certaines hypothèses, non ce qui se produira. Toujours indiquer le modèle, le scénario, l’horizon (proche, moyen, lointain) et la période de référence. Le climat se lit sur au moins trente ans, non sur une année.</p>' },
      { t: 'Émissions calculées, non mesurées', h: '<p>Les inventaires d’émissions territoriaux sont modélisés à partir de statistiques nationales (consommations, kilomètres parcourus, cheptel) ; ils ne sont pas mesurés. Ils supposent des choix de périmètre : émissions territoriales (scopes 1 et 2) ou empreinte carbone incluant la consommation (scope 3). Ne comparer que des inventaires produits par la même méthode et le même millésime.</p>' },
      { t: 'DPE : un changement de méthode en 2021', h: '<p>Le DPE a été réformé en juillet 2021 (méthode unique, seuils modifiés) : les étiquettes avant et après cette date ne sont pas comparables. Il s’agit d’une consommation conventionnelle, non de la consommation réelle. Enfin, les DPE disponibles ne couvrent pas l’ensemble du parc : les résultats décrivent les logements récemment vendus, loués ou construits.</p>' },
      { t: 'Secret statistique sur l’énergie', h: '<p>Les consommations d’électricité et de gaz sont masquées dès que le nombre de points de livraison est faible ou qu’un gros consommateur domine. Les communes rurales sont particulièrement concernées : travailler à l’EPCI ou regrouper.</p>' },
      { t: 'Qualité de l’air : stations et modélisation', h: '<p>Les mesures proviennent de stations concentrées en ville. En milieu rural, les valeurs sont modélisées et peuvent masquer des situations locales (chauffage au bois, épandages). Distinguer mesure et modélisation, moyenne annuelle et pics.</p>' }
    ],
    restit: [
      { type: 'Graphique', t: 'Écarts de température à la moyenne de référence (bandes climatiques)', quand: 'Montrer le réchauffement observé de façon lisible.', outils: {
        tableur: ['Télécharger les températures moyennes annuelles d’une station de référence sur au moins 60 ans.', 'Calculer l’écart à la moyenne de la période de référence (R3) ; histogramme vertical avec couleurs divergentes (bleu pour les valeurs négatives, rouge pour les valeurs positives).'],
        magrit: ['Sans objet.'],
        qgis: ['Sans objet (utiliser R : paquet <code>ggplot2</code> pour les bandes climatiques).'] }, piege: 'Ne jamais tronquer l’axe pour exagérer l’écart.' },
      { type: 'Graphique', t: 'Barres empilées à 100 % : étiquettes DPE des logements', quand: 'Comparer la performance énergétique de plusieurs territoires ou types de parc.', outils: {
        tableur: ['Un tableau territoires × classes DPE (parts).', 'Regrouper les classes (A-B, C, D, E à G) si le nombre de logements est faible.', 'Barres empilées à 100 %, palette ordonnée du plus performant au moins performant.'],
        magrit: ['Cartographier la part de logements F et G par commune (ratio).'],
        qgis: ['Joindre le tableau de l’ADEME agrégé par commune (R2) ; symbologie graduée sur la part F et G.'] } },
      { type: 'Graphique', t: 'Bilan des consommations et des émissions par secteur', quand: 'Identifier les postes dominants.', outils: {
        tableur: ['Télécharger les tableaux communaux ou intercommunaux de l’inventaire (Atmo) : émissions par secteur et par énergie.', 'Barres empilées ou histogramme trié (résidentiel, transports routiers, agriculture, industrie, tertiaire) ; ajouter la valeur par habitant dans un second graphique.'],
        magrit: ['Cartographier les émissions par habitant (ratio) pour comparer les communes.'],
        qgis: ['Symbologie graduée par secteur dominant.'] }, piege: 'Comparer des inventaires de deux méthodes ou deux millésimes différents.' },
      { type: 'Carte', t: 'Carte de la chaleur et du confort d’été (projections DRIAS)', quand: 'Documenter l’exposition à la chaleur future.', outils: {
        qgis: ['Télécharger un indicateur DRIAS (nombre de jours ≥ 35 °C, horizon 2050, scénario retenu) sous forme de grille ; charger dans QGIS (couche vectorielle de points) et découper sur le territoire.', 'Interpoler ou représenter les points en symboles ; ajouter une carte de référence pour la période 1976-2005.'],
        magrit: ['Importer les points de grille et les cartographier en symboles proportionnels ou lissage (R7).'],

    exemple: {
      intro: '<p>Deux documents servent d’appui : l’état initial de l’environnement du SCoT de la CA Gaillac-Graulhet (climat, énergie, air, déchets) et le porter à connaissance du PLH (performance énergétique du parc social, selon le RPLS). Chaque bloc précise la nature de la donnée : observation, inventaire modélisé, projection.</p>',
      blocs: [
        { titre: 'Un climat qui se réchauffe : observations et projections', html: M.table(['Repère', 'Valeur', 'Nature de la donnée'], [
          ['Hausse de la température moyenne annuelle à Graulhet, entre 1979-1989 et 2011-2021', 'Près de +1 °C (environ +1,2 °C en été)', 'Observation (réanalyse ERA5)'],
          ['Hausse régionale des températures, 1959-2009', '+0,32 °C par décennie', 'Observation (Occitanie)'],
          ['Grand Sud-Ouest, horizon 2030', '+0,8 à +1,4 °C', 'Projection (Météo-France)'],
          ['Grand Sud-Ouest, horizon 2050', '+1,4 à +2,2 °C en moyenne annuelle', 'Projection (Météo-France)'],
          ['Part du temps en état de sécheresse', 'Actuellement 10 à 15 % ; 10 à 30 % en 2030 ; 30 à 70 % en 2050', 'Projection (Météo-France)']
        ]) + M.co('warn', 'Trois natures de données dans un même tableau', '<p>Les deux premières lignes sont des observations ; les autres sont des projections avec des fourchettes. Le tableau du document ne précise pas ici le scénario d’émission retenu : c’est une lacune à signaler dans un rapport, car sans scénario ni modèle, une projection n’est pas exploitable.</p>') + '<p class="src-line">Source : ' + EIE + ', partie 2.2.</p>' },
        { titre: 'Consommations d’énergie : résidentiel et transports en tête', charts: [{ mode: 'h', title: 'Consommation d’énergie finale de la CAGG par secteur en 2021 (GWh)', cats: ['Résidentiel', 'Transports routiers', 'Industrie', 'Agriculture et tertiaire (par différence)'], series: [{ name: 'GWh', values: [493, 485, 369, 190] }], unit: 'GWh', src: EIE + ' (ORCEO) ; total 1 537 GWh, soit 20,8 MWh par habitant contre 20,0 pour la région ; la dernière valeur est calculée par différence' }],
          lecture: 'Le résidentiel (32 %) et les transports routiers (32 %, quasi exclusivement des produits pétroliers) pèsent chacun près d’un tiers des consommations, devant l’industrie (24 %, surtout du gaz naturel). La consommation par habitant est supérieure à la moyenne régionale. Un poste calculé « par différence » doit être signalé comme tel : ici, agriculture et tertiaire ensemble.', src: EIE },
        { titre: 'Production d’énergies renouvelables : situation et potentiel', charts: [{ mode: 'h', title: 'Production d’énergies renouvelables en 2021 (GWh)', cats: ['Bois-énergie', 'Hydroélectricité', 'Solaire photovoltaïque', 'Méthanisation'], series: [{ name: 'GWh', values: [149, 114, 65, 42] }], unit: 'GWh', src: EIE + ' (ORCEO) ; total de 371,4 GWh, soit 24 % de la consommation ; le solaire thermique représente environ 1 %' }, { mode: 'h', title: 'Potentiel de production mobilisable en 2050 selon le diagnostic du PCAET (GWh par an)', cats: ['Méthanisation', 'Solaire photovoltaïque', 'Bois-énergie', 'Hydroélectricité', 'Éolien', 'Géothermie', 'Solaire thermique'], series: [{ name: 'GWh par an', values: [726, 508, 283, 210, 100, 84, 39] }], unit: 'GWh/an', src: EIE + ' ; total 1 950 GWh par an' }],

        { titre: 'Gaz à effet de serre et polluants atmosphériques', charts: [{ mode: 'h', title: 'Évolution des émissions de polluants atmosphériques entre 2011 et 2021 (%)', cats: ['NH₃ (1 076 t)', 'Particules PM2,5 (263 t)', 'Particules PM10 (455 t)', 'SO₂ (24 t)', 'COV (884 t)', 'NOx (937 t)'], series: [{ name: 'Évolution 2011-2021', values: [11, -24, -18, -19, -21, -30] }], dec: 0, unit: '%', src: EIE + ' (Atmo Occitanie) ; entre parenthèses : émissions 2021' }],
          lecture: 'Les émissions de polluants baissent sur dix ans, sauf l’ammoniac (+11 %), d’origine agricole. L’indice de qualité de l’air de 2023, calculé par Atmo Occitanie (le territoire n’a aucune station de mesure), est resté « moyen » pendant 256 jours sur 365 et « bon » pendant 2 jours ; l’ozone est le principal polluant en cause. Pour les gaz à effet de serre, le territoire a émis 405 kteqCO₂ en 2021 (5,6 t par habitant, en baisse de près de 7 % depuis 2013), d’abord par l’agriculture puis les transports. La séquestration nette de carbone est évaluée à 145 kteqCO₂ par an, soit environ 36 % des émissions de CO₂ d’origine anthropique : ce chiffre provient d’une autre source et d’une autre année (PCAET, données 2018) et ne se compare pas directement aux 405 kt de 2021.', src: EIE },
        { titre: 'Déchets ménagers : comparer des territoires de gestion différents', charts: [{ mode: 'h', title: 'Déchets ménagers collectés en 2020 (kg par habitant)', cats: ['CAGG (hors Coufouleux et Giroussens)', 'Territoire de Trifyl', 'SMITCOM de Lavaur', 'Moyenne nationale', 'Moyenne régionale'], series: [{ name: 'kg par habitant', values: [294, 312.8, 319, 340, 360] }], dec: 1, unit: 'kg/hab.', src: EIE + ', partie 6.3.2 ; hors déchetteries' }],

        { titre: 'Performance énergétique du parc social (RPLS, 2025)', charts: [{ mode: 'stack100', seq: true, title: 'Parc social par étiquette DPE (classes regroupées)', cats: ['Gaillac', 'Graulhet', 'Lisle-sur-Tarn', 'Rabastens', 'Reste CAGG', 'CAGG', 'Tarn'], series: [{ name: 'A et B', values: [20.8, 33.9, 64.2, 59.1, 51, 34.8, 15.4] }, { name: 'C', values: [45, 26.9, 21.6, 13.6, 19.9, 32.4, 31.1] }, { name: 'D', values: [32.1, 26.9, 2.2, 15.2, 18.6, 24.9, 37.9] }, { name: 'E, F et G', values: [2.1, 12.4, 12.1, 12.1, 10.4, 7.8, 15.6] }], dec: 1, unit: '%', src: PLH + ' ; classes A et B, et E à G, regroupées' }],

      html: M.co('tip', 'Aller plus loin : le parc privé', '<p>Le même graphique se construit avec les DPE de l’ADEME (fichier « DPE logements existants »), agrégés par commune : la part de logements F et G donne une première approche des besoins de rénovation. Ne pas oublier de rappeler que ces DPE ne couvrent que les logements récemment vendus, loués ou construits.</p>'),

  /* =============== 14. RISQUES =============== */
  M.chapter({
    id: 'risques', num: 14, part: 'B', short: 'Risques naturels et technologiques', title: 'Risques naturels, technologiques et sanitaires',
    card: 'Aléas, enjeux exposés, sinistralité, sites pollués, exposition de la population et du bâti.',
    kicker: 'Environnement', duree: '60 min', niveau: 'Intermédiaire à avancé', outils: 'Tableur · QGIS',
    resume: 'Identifier les aléas (inondation, retrait-gonflement des argiles, mouvements de terrain, feux de forêt, sismicité), les risques technologiques et les pollutions, puis croiser ces aléas avec les enjeux (population, bâti, activités) pour mesurer l’exposition. Chapitre destiné en priorité à la spécialité GSE.',
    enjeux: {
      intro: '<p>Un risque est la rencontre d’un <b>aléa</b> (phénomène susceptible de se produire, avec une intensité et une probabilité) et d’<b>enjeux</b> (personnes, biens, activités, milieux exposés), modulée par la <b>vulnérabilité</b> (capacité des enjeux à résister et à se rétablir). Le diagnostic de risques se construit donc en deux temps : cartographier les aléas, puis les croiser avec les enjeux pour mesurer l’exposition.</p><p>Les risques ne sont pas figés : le climat, l’urbanisation (imperméabilisation) et l’état des milieux les modifient. Ce thème est étroitement lié à ceux de l’eau, du climat, du foncier et de l’aménagement.</p>',
      questions: [
        'À quels aléas le territoire est-il exposé (inondation, argiles, mouvements de terrain, feux de forêt, sismicité, technologiques) ?',
        'Quelle part de la population, des logements, des emplois et des équipements se situe en zone d’aléa ?',
        'Quel est l’historique des événements et des reconnaissances de catastrophe naturelle (CatNat) ?',
        'Quels sites présentent des risques technologiques ou des pollutions historiques ?',
        'Comment évolue l’exposition (urbanisation en zone d’aléa, changement climatique) ?'
      ],
      indicateurs: [
        { n: 'Part de la population ou des logements en zone d’aléa', f: 'population (ou logements) dans la zone ÷ population totale × 100', l: 'Croiser les enjeux localisés (carreaux de population, bâti) avec la couche d’aléa ; la précision du résultat dépend de la finesse des enjeux.' },
        { n: 'Nombre d’arrêtés CatNat par commune et par péril', f: 'décompte des arrêtés de reconnaissance (base Gaspar) sur la période', l: 'Mesure un événement reconnu, non le risque ; dépend de la procédure administrative.' },
        { n: 'Surface ou nombre de bâtiments en zone d’exposition moyenne ou forte aux argiles', f: 'bâtiments en zone d’exposition moyenne ou forte ÷ bâtiments totaux × 100', l: 'Cartographie à l’échelle de conception 1/50 000 : indicative à l’échelle de la parcelle.' },
        { n: 'Nombre d’établissements sensibles en zone d’aléa', f: 'écoles, EHPAD, hôpitaux, équipements de secours dans l’emprise ÷ total', l: 'Croiser la BPE et FINESS avec les zones d’aléa.' },
        { n: 'Nombre de sites pollués ou à risque technologique', f: 'ICPE, sites Seveso, secteurs d’information sur les sols par commune', l: 'Déclaratifs et non exhaustifs ; la présence d’un site ne signifie pas pollution avérée.' }
      ],
      liens: [['eau', 'inondations et sécheresses relèvent du cycle de l’eau.'], ['climat', 'les aléas climatiques évoluent avec le réchauffement.'], ['foncier', 'l’urbanisation en zone d’aléa augmente l’exposition ; l’imperméabilisation aggrave le ruissellement.'], ['milieux', 'zones humides, haies et forêts régulent des aléas.'], ['parc', 'l’âge et le type de bâti modulent la vulnérabilité.']]

    sources: [

      s('Base Gaspar (gestion assistée des procédures administratives relatives aux risques) et arrêtés de catastrophes naturelles', 'Ministère de l’Intérieur, ministère de la transition écologique', 'https://www.georisques.gouv.fr', 'libre', 'Commune', 'Continue', 'CSV', 'Georisques, rubrique Données ; data.gouv.fr « Base nationale de gestion assistée des procédures administratives relatives aux risques »', 'Un arrêté reconnaît un événement, ce n’est pas une mesure des dégâts.'),
      s('Atlas des zones inondables (AZI), enveloppe approchée des inondations potentielles (EAIP), territoires à risque important d’inondation (TRI)', 'DREAL, DDT', 'https://www.georisques.gouv.fr', 'libre', 'Polygones', 'Cycles de six ans (directive inondation)', 'Shapefile', 'Georisques ; portail cartographique de la DREAL', 'Enveloppes approchées à ne pas confondre avec des plans réglementaires ; se limitent à l’aléa principal.'),
      s('Cartographie de l’exposition au retrait-gonflement des argiles', 'BRGM', 'https://www.georisques.gouv.fr/risques/retrait-gonflement-des-argiles', 'libre', 'Polygones (1/50 000)', 'Mise à jour périodique (à vérifier)', 'Shapefile', 'Georisques ; site du BRGM', 'L’exposition dépend de la nature du sol, non des constructions : la vulnérabilité du bâti est un autre sujet.'),
      s('Inventaires des cavités, mouvements de terrain, radon', 'BRGM, IRSN', 'https://www.georisques.gouv.fr', 'libre', 'Point, commune', 'Continue', 'Shapefile, CSV', 'Georisques, rubriques Cavités, Mouvements de terrain, Radon', 'Inventaires alimentés par déclaration : incomplets.'),

      s('Secteurs d’information sur les sols (SIS) et inventaires d’anciens sites industriels (Basias, Basol)', 'BRGM, ministère de la transition écologique', 'https://www.georisques.gouv.fr', 'libre', 'Site', 'Continue', 'Shapefile, CSV', 'Georisques, rubrique Sols pollués', 'Les bases historiques signalent une activité passée, non une pollution avérée.'),
      s('Plans de prévention des risques (PPR), dossiers départementaux, DICRIM', 'DDT, communes', 'https://www.geoportail-urbanisme.gouv.fr', 'libre', 'Périmètre', 'Continue', 'Shapefile, PDF', 'Géoportail de l’urbanisme, Georisques, préfecture', 'Les périmètres réglementaires ne sont ici retenus que comme couches d’aléa ; la dimension juridique ne fait pas l’objet de ce manuel.')
    ],
    limites: [
      { t: 'Aléa, enjeu, vulnérabilité, risque', h: '<p>Une carte d’aléa n’est pas une carte de risque : une zone inondable inhabitée n’expose personne. Le risque naît du croisement entre l’aléa et les enjeux, modulé par la vulnérabilité. Utiliser le mot « risque » pour une couche d’aléa est une erreur fréquente.</p>' },
      { t: 'Échelle de conception des cartes d’aléa', h: '<p>Les cartes d’exposition (argiles, EAIP, AZI) sont élaborées à des échelles comprises entre le 1/25 000 et le 1/100 000. Elles conviennent pour une analyse communale ou intercommunale, non pour statuer sur une parcelle. Un zonage n’est pas une mesure de la probabilité ni de l’intensité de l’événement.</p>' },
      { t: 'Sinistralité et reconnaissance administrative', h: '<p>Le nombre d’arrêtés de catastrophe naturelle traduit la procédure de reconnaissance et non l’intensité réelle des dégâts. Il varie avec la vigilance des communes, les critères de reconnaissance (qui ont évolué pour la sécheresse) et la présence d’enjeux exposés. Les événements peuvent être reconnus longtemps après leur survenue.</p>' },
      { t: 'Inventaires incomplets et déclaratifs', h: '<p>Cavités, mouvements de terrain, sites pollués sont recensés par déclaration ou par étude. L’absence d’un site dans la base ne signifie pas que le risque n’existe pas ; elle peut refléter une absence d’étude. Il faut compléter par les connaissances locales (communes, services, riverains).</p>' },
      { t: 'Des risques qui évoluent', h: '<p>Un diagnostic fondé sur l’historique sous-estime les risques dont la fréquence et l’intensité évoluent (sécheresse, canicule, incendie). Il convient d’ajouter un regard prospectif fondé sur les projections climatiques (thème Climat) et sur les évolutions de l’urbanisation.</p>' }

      intro: '<p>L’état initial de l’environnement du SCoT de la CA Gaillac-Graulhet (approuvé en février 2026) décrit les aléas du territoire à partir du dossier départemental sur les risques majeurs du Tarn (DDRM 2021), de Géorisques et du BRGM. Les plans de prévention sont ici utilisés comme sources de <b>localisation des aléas</b> ; leur portée réglementaire n’est pas traitée. Le tableau de structure de la fiche et le pas à pas viennent ensuite pour reproduire la démarche.</p>',

<script>

(function () {

  /* ---------- glossaire ---------- */

    ['Aire d’attraction d’une ville', 'Zonage de l’Insee (2020) qui délimite un pôle et une couronne dont au moins 15 % des actifs travaillent dans le pôle. Il a succédé aux aires urbaines de 2010.'],

    ['Bassin de vie', 'Plus petit territoire sur lequel les habitants ont accès aux équipements et services les plus courants et à l’emploi. Zonage de l’Insee.'],
    ['BPE (base permanente des équipements)', 'Base de l’Insee qui recense les équipements et services (commerces, santé, éducation, sport…) et les classe en gammes de proximité, intermédiaire et supérieure.'],

  /* ---------- carte des interactions ---------- */

    resume: 'Les quatorze thèmes d’observation ne sont pas indépendants. Cette carte interactive montre les influences documentées d’un thème sur un autre et renvoie à la fiche correspondante.',
    html: function () {
      return '<div class="prose"><p>Un état des lieux qui juxtapose des chapitres sans les relier reste descriptif. La lecture systémique consiste à expliquer une observation par les autres thèmes, et à identifier les boucles : par exemple, la hausse des prix du foncier pousse les ménages vers des communes plus éloignées, ce qui accroît les flux domicile-travail, donc les émissions, et la demande de services dans ces communes.</p></div>' +
        '<div class="prose full">' + M.widget('sysmap') + '</div>' +
        '<div class="prose"><h3>Exercice</h3><ol><li>Choisissez un thème et lisez les flèches entrantes et sortantes.</li><li>Pour une flèche, cherchez dans le territoire de votre atelier un indicateur chiffré qui illustre le lien.</li><li>Cherchez une boucle (A agit sur B qui agit sur C qui agit sur A) et rédigez-la en trois phrases.</li></ol>' +
        M.co('warn', 'Limite de la carte', '<p>Les flèches représentent des influences plausibles et documentées, non des lois. Leur intensité varie selon les territoires : c’est précisément l’objet de l’état des lieux de la mesurer.</p>') + '</div>';

        ['La demande de logement social passe de 740 à 1 296 ménages entre 2018 et 2025 ; 4,8 demandeurs pour une attribution en 2025.', 'Hausse des prix de l’ancien et du foncier (maisons : de 1 428 à 1 908 €/m² entre 2015 et 2022), report vers le parc social ; peu de rotation dans le parc récent.', 'Fluidifier le parcours résidentiel et réduire la pression sur le parc social.', 'Ratio demandeurs / attributions ; taux de mobilité du parc social.'],
        ['14 139 actifs quittent quotidiennement la CAGG pour travailler ; 52 % seulement travaillent sur place.', 'Territoire résidentiel pris entre Albi et Toulouse ; report résidentiel lié aux prix.', 'Maîtriser la dépendance aux emplois extérieurs et à la voiture.', 'Part des actifs travaillant sur place ; part modale de la voiture.'],
        ['81,6 % des logements autorisés sont individuels ; terrain médian de 910 m² en 2015 à 701 m² en 2023.', 'Marché de la maison individuelle sur l’axe de l’A68 ; renchérissement du foncier qui réduit la taille des terrains.', 'Maintenir une offre de logements diversifiée en limitant la consommation d’espace.', 'Part de l’individuel ; surface consommée par logement.'],

      return '<div class="prose">' +
        '<h2>1. Un constat n’est pas un enjeu</h2><p>Un <b>constat</b> est un fait chiffré, daté, sourcé et comparé. Une <b>explication</b> relie ce fait à un mécanisme (ce qui agit sur quoi). Un <b>enjeu</b> énonce ce que le territoire peut gagner ou perdre selon l’évolution du constat : il se formule sans nommer de solution. Les <b>orientations et actions</b> relèvent d’une étape ultérieure du projet de territoire, qui n’est pas l’objet de ce manuel.</p>' +

        { q: 'Que mesure l’indicateur de concentration d’emploi ?', o: ['Le taux de chômage', 'Les emplois offerts pour 100 actifs occupés résidents', 'La part de l’industrie', 'La productivité'], a: 1, e: 'Supérieur à 100 : le territoire attire des actifs ; inférieur : il en exporte.' },
        { q: 'La consommation d’espaces NAF et l’artificialisation :', o: ['Sont identiques', 'Sont deux notions distinctes qui appellent des sources différentes', 'Ne concernent que les routes', 'Sont mesurées par Corine Land Cover uniquement'], a: 1, e: 'La consommation mesure l’urbanisation effective ; l’artificialisation, l’altération des fonctions du sol.' },
        { q: 'Une commune a une richesse spécifique très élevée dans l’INPN. Première vérification ?', o: ['Sa surface', 'La pression d’observation', 'Son nombre d’habitants', 'La date de création'], a: 1, e: 'Les observations reflètent l’effort de prospection autant que la biodiversité.' },
        { q: 'Une masse d’eau est classée « état moyen ». Que signifie la règle du pire ?', o: ['La moyenne de tous les paramètres est moyenne', 'Un seul paramètre déclassant suffit à fixer la classe', 'Le pire paramètre est exclu', 'Elle est classée selon les usages'], a: 1, e: 'Le classement retient l’élément de qualité le plus défavorable.' },
        { q: 'Les étiquettes DPE de 2019 et de 2023 peuvent-elles être comparées directement ?', o: ['Oui', 'Non : la méthode a changé en 2021', 'Oui, avec une correction de 5 %', 'Non : les DPE de 2019 sont supprimés'], a: 1, e: 'Le changement de méthode de juillet 2021 rompt la série.' },
        { q: 'Une zone d’aléa fort d’inondation sans aucun bâtiment :', o: ['Est un risque fort', 'Est un aléa fort sans enjeu exposé, donc sans risque humain immédiat', 'N’existe pas', 'Est un risque technologique'], a: 1, e: 'Le risque suppose des enjeux exposés.' },
        { q: 'Un enjeu bien formulé :', o: ['Propose une solution', 'Énonce ce que le territoire gagne ou perd selon l’évolution du constat', 'Décrit un chiffre', 'Est un objectif chiffré'], a: 1, e: 'L’enjeu qualifie ce qui est en jeu ; les actions relèvent d’une étape ultérieure.' }
      ]) + '</div>';
    }
  });
})();

</script>
<script>
/* Démarrage : routage, événements, recherche */
(function () {
  'use strict';
  var M = window.M;

  function route() {
    var h = (location.hash || '').replace(/^#\/?/, '').split('/');
    var id = h[0] || 'accueil', tab = h[1] || '';
    if (!M.byId[id]) id = 'accueil';
    M.render(id, tab);
    document.body.classList.remove('menu');
  }
  window.addEventListener('hashchange', route);

  document.addEventListener('click', function (e) {
    var t = e.target;
    var tool = t.closest && t.closest('.tt button[data-tool]');
    if (tool) {
      var rec = tool.closest('.rec');
      Array.prototype.forEach.call(rec.querySelectorAll('.tt button'), function (b) { b.setAttribute('aria-selected', b === tool ? 'true' : 'false'); });
      Array.prototype.forEach.call(rec.querySelectorAll('.pane'), function (p) { p.hidden = p.getAttribute('data-pane') !== tool.getAttribute('data-tool'); });
      return;
    }
    var f = t.closest && t.closest('.filters[data-filter-group="src"] button');
    if (f) {
      var val = f.getAttribute('data-f');
      Array.prototype.forEach.call(f.parentNode.querySelectorAll('button'), function (b) { b.setAttribute('aria-pressed', b === f ? 'true' : 'false'); });
      Array.prototype.forEach.call(document.querySelectorAll('.src'), function (s) { s.hidden = !(val === 'all' || s.getAttribute('data-acces').indexOf(val) > -1); });
      return;
    }
    var tb = t.closest && t.closest('[data-act="tbl"]');
    if (tb) {
      var box = tb.closest('figure').querySelector('.chart-table'); box.hidden = !box.hidden;
      tb.textContent = box.hidden ? 'Afficher le tableau' : 'Masquer le tableau'; tb.setAttribute('aria-expanded', String(!box.hidden));
      return;
    }
    var qc = t.closest && t.closest('[data-act="qcheck"]');
    if (qc) {
      var quiz = qc.closest('[data-quiz]'), id = quiz.getAttribute('data-quiz'), arr = M.quizzes[id], score = 0, answered = 0;
      Array.prototype.forEach.call(quiz.querySelectorAll('.qq'), function (fs) {
        var qi = +fs.getAttribute('data-qi'), q = arr[qi], sel = fs.querySelector('input:checked'), labels = fs.querySelectorAll('label');
        fs.classList.remove('ok', 'ko'); Array.prototype.forEach.call(labels, function (l) { l.classList.remove('right', 'wrong'); });
        if (!sel) { fs.classList.remove('done'); return; }
        answered++; fs.classList.add('done');
        var ok = +sel.value === q.a; if (ok) score++;
        fs.classList.add(ok ? 'ok' : 'ko'); labels[q.a].classList.add('right'); if (!ok) sel.closest('label').classList.add('wrong');
      });
      var sc = quiz.querySelector('.qscore');
      if (answered < arr.length) sc.textContent = 'Répondez à toutes les questions (' + answered + ' / ' + arr.length + ' traitées). Score provisoire : ' + score;
      else { sc.textContent = 'Score : ' + score + ' / ' + arr.length; M.state.quiz[id] = { s: score, t: arr.length }; M.save(); M.renderRail(id); }
      return;
    }
    if (t.closest && t.closest('#menuBtn')) { document.body.classList.toggle('menu'); return; }
    if (t.closest && t.closest('#rail a')) { document.body.classList.remove('menu'); }
    if (!(t.closest && t.closest('.searchbox'))) document.getElementById('results').hidden = true;
  });

  document.addEventListener('change', function (e) {
    var c = e.target;
    if (c.matches && c.matches('input[data-ck]')) {
      var id = c.closest('[data-checks]').getAttribute('data-checks');
      M.state.check[id] = M.state.check[id] || {}; M.state.check[id][c.getAttribute('data-ck')] = c.checked ? 1 : 0; M.save();
    }
  });

  /* info-bulles des graphiques */
  var tip = document.getElementById('tip');
  document.addEventListener('pointerover', function (e) {
    var m = e.target.closest && e.target.closest('[data-tip]');
    if (m) { tip.textContent = m.getAttribute('data-tip'); tip.hidden = false; }
  });
  document.addEventListener('pointermove', function (e) {
    if (tip.hidden) return;
    var x = Math.min(window.innerWidth - tip.offsetWidth - 8, e.clientX + 14), y = e.clientY + 16;
    if (y + tip.offsetHeight > window.innerHeight - 8) y = e.clientY - tip.offsetHeight - 10;
    tip.style.left = Math.max(8, x) + 'px'; tip.style.top = y + 'px';
  });
  document.addEventListener('pointerout', function (e) { if (e.target.closest && e.target.closest('[data-tip]')) tip.hidden = true; });

  /* recherche plein texte */
  var q = document.getElementById('q'), res = document.getElementById('results');
  function search() {
    var v = q.value.trim().toLowerCase();
    if (v.length < 2) { res.hidden = true; return; }
    var terms = v.split(/\s+/), idx = M.searchIndex(), hits = [];
    idx.forEach(function (d) {
      var hay = (d.title + ' ' + d.text).toLowerCase();
      if (terms.every(function (t) { return hay.indexOf(t) > -1; })) {
        var p = hay.indexOf(terms[0]), snip = d.text.substr(Math.max(0, p - 50), 120);
        hits.push({ d: d, s: (d.title.toLowerCase().indexOf(terms[0]) > -1 ? 2 : 0) + (d.tab === 'enjeux' ? 1 : 0), snip: snip });
      }
    });
    hits.sort(function (a, b) { return b.s - a.s; });
    var esc = M.esc, h = hits.slice(0, 14).map(function (x) {
      var href = '#/' + x.d.id + (x.d.tab ? '/' + x.d.tab : '');
      return '<a href="' + href + '"><b>' + esc(x.d.title) + '</b><span>' + esc(x.d.label) + ' · …' + esc(x.snip) + '…</span></a>';
    }).join('');
    res.innerHTML = h || '<a><b>Aucun résultat</b><span>Essayez un autre terme.</span></a>'; res.hidden = false;
  }
  q.addEventListener('input', search);
  q.addEventListener('keydown', function (e) { if (e.key === 'Escape') { res.hidden = true; q.blur(); } });
  res.addEventListener('click', function () { res.hidden = true; q.value = ''; });

  route();
})();

</script>
